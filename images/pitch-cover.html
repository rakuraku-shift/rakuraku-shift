<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RAKURAKU ピッチカバー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4 landscape;margin:0}
html,body{width:100%;height:100%;background:#0F0F23;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.frame{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.frame img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.controls{position:fixed;top:15px;right:15px;background:rgba(255,255,255,.95);padding:10px 14px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index:9999;font-family:-apple-system,sans-serif;display:flex;gap:8px}
.controls button{background:#4F46E5;color:#fff;border:none;padding:10px 18px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:13px}
.controls button.full{background:#0F172A}
@media print{
  .controls{display:none}
  html,body{background:#fff}
}
</style>
</head>
<body>
<div class="controls">
  <button onclick="document.documentElement.requestFullscreen()" class="full">⛶ 全画面表示</button>
  <button onclick="window.print()">📄 PDFとして保存</button>
</div>
<div class="frame">
  <img src="pitch-cover.svg" alt="RAKURAKU ピッチカバー" />
</div>
<script>
// ESCで全画面解除のヒント
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen();
});
</script>
</body>
</html>
