<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgAlert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="alertShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgAlert)"/>

  <!-- Title -->
  <text x="640" y="80" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">⚠️ 労基法アラート</text>
  <text x="640" y="112" font-family="-apple-system,sans-serif" font-size="14" fill="#FCA5A5" text-anchor="middle" letter-spacing="3">LABOR LAW VIOLATION DETECTOR</text>

  <!-- Phone mockup -->
  <g transform="translate(390, 155)" filter="url(#alertShadow)">
    <rect x="0" y="0" width="500" height="510" rx="22" fill="#fff"/>

    <!-- Header -->
    <rect x="0" y="0" width="500" height="60" rx="22" fill="url(#alertGrad)"/>
    <rect x="0" y="38" width="500" height="22" fill="url(#alertGrad)"/>
    <text x="30" y="38" font-family="-apple-system,sans-serif" font-size="17" font-weight="900" fill="#fff">🚨 違反検知 (3件)</text>
    <text x="470" y="38" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="end">9月のシフト</text>

    <!-- Alert 1: 連勤違反 -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="460" height="100" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="18" fill="url(#alertGrad)"/>
      <text x="32" y="44" font-family="-apple-system,sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">!</text>
      <text x="62" y="28" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#991B1B">⚠️ 連続勤務 7 日超え</text>
      <text x="62" y="48" font-family="-apple-system,sans-serif" font-size="11" fill="#991B1B">スタッフB / 9/2 〜 9/9 (8日連勤)</text>
      <rect x="62" y="62" width="220" height="22" rx="11" fill="#fff" stroke="#FCA5A5" stroke-width="1"/>
      <text x="172" y="77" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle">→ 9/8 を休みに変更を推奨</text>
    </g>

    <!-- Alert 2: 休憩不足 -->
    <g transform="translate(20, 196)">
      <rect x="0" y="0" width="460" height="100" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="18" fill="url(#warnGrad)"/>
      <text x="32" y="44" font-family="-apple-system,sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">⏱</text>
      <text x="62" y="28" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#92400E">⚠️ 休憩時間 不足</text>
      <text x="62" y="48" font-family="-apple-system,sans-serif" font-size="11" fill="#92400E">スタッフC / 8h 勤務 = 45分以上必須</text>
      <rect x="62" y="62" width="220" height="22" rx="11" fill="#fff" stroke="#F59E0B" stroke-width="1"/>
      <text x="172" y="77" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">→ 休憩 30分 → 60分 に修正</text>
    </g>

    <!-- Alert 3: 深夜割増忘れ -->
    <g transform="translate(20, 312)">
      <rect x="0" y="0" width="460" height="100" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="32" cy="38" r="18" fill="url(#warnGrad)"/>
      <text x="32" y="44" font-family="-apple-system,sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">🌙</text>
      <text x="62" y="28" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#92400E">⚠️ 深夜手当 計算忘れ</text>
      <text x="62" y="48" font-family="-apple-system,sans-serif" font-size="11" fill="#92400E">スタッフA / 23:00〜4:00 の +25% 未加算</text>
      <rect x="62" y="62" width="220" height="22" rx="11" fill="#fff" stroke="#F59E0B" stroke-width="1"/>
      <text x="172" y="77" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">→ 自動で +¥2,400 加算済み</text>
    </g>

    <!-- 一括修正ボタン -->
    <g transform="translate(20, 428)">
      <rect x="0" y="0" width="460" height="60" rx="14" fill="#0F172A"/>
      <text x="230" y="38" font-family="-apple-system,sans-serif" font-size="17" font-weight="900" fill="#fff" text-anchor="middle">🛠 一括修正で全て解決</text>
    </g>
  </g>

  <!-- Left features -->
  <g transform="translate(40, 180)" font-family="-apple-system,sans-serif" fill="#fff">
    <text x="0" y="0" font-size="16" font-weight="900">検知する違反</text>
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="13" font-weight="700">📅 連勤6日超</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">労基法 第35条</text>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="13" font-weight="700">⏰ 残業40h/月超</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">36協定 違反</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" font-size="13" font-weight="700">☕ 休憩45分未満</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">労基法 第34条</text>
    </g>
    <g transform="translate(0, 152)">
      <text x="0" y="0" font-size="13" font-weight="700">🌙 深夜計算漏れ</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">労基法 第37条</text>
    </g>
  </g>

  <!-- Right features -->
  <g transform="translate(920, 180)" font-family="-apple-system,sans-serif" fill="#fff">
    <text x="0" y="0" font-size="16" font-weight="900">守れる経営者</text>
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="13" font-weight="700">🛡 訴訟リスク回避</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">違反前にアラート</text>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="13" font-weight="700">💼 労務監査対応</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">記録自動保存</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" font-size="13" font-weight="700">🤝 スタッフ信頼</text>
      <text x="0" y="18" font-size="10" fill="#FCA5A5">公正な労働環境</text>
    </g>
  </g>
</svg>
