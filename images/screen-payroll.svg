<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgPay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="payGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="payShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgPay)"/>

  <!-- Title -->
  <text x="640" y="80" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">給与自動計算</text>
  <text x="640" y="112" font-family="-apple-system,sans-serif" font-size="14" fill="#A5B4FC" text-anchor="middle" letter-spacing="3">DEEP NIGHT + OVERTIME AUTO-PAY</text>

  <!-- Phone mockup -->
  <g transform="translate(390, 155)" filter="url(#payShadow)">
    <rect x="0" y="0" width="500" height="510" rx="22" fill="#fff"/>

    <!-- Header -->
    <rect x="0" y="0" width="500" height="64" rx="22" fill="url(#payGrad)"/>
    <rect x="0" y="42" width="500" height="22" fill="url(#payGrad)"/>
    <text x="30" y="40" font-family="-apple-system,sans-serif" font-size="18" font-weight="900" fill="#fff">💰 8 月給与明細</text>
    <text x="470" y="40" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="end">スタッフA</text>

    <!-- 内訳セクション -->
    <g transform="translate(30, 92)">
      <text x="0" y="0" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#0F172A">📊 内訳 (8月)</text>

      <!-- 基本給 -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="440" height="48" rx="10" fill="#F8FAFC"/>
        <text x="14" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#475569">基本時給 1,200円</text>
        <text x="14" y="36" font-family="-apple-system,sans-serif" font-size="11" fill="#94A3B8">出勤 18日 × 6時間 = 108h</text>
        <text x="426" y="32" font-family="-apple-system,sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="end">¥129,600</text>
      </g>

      <!-- 深夜手当 -->
      <g transform="translate(0, 78)">
        <rect x="0" y="0" width="440" height="48" rx="10" fill="#FEF3C7"/>
        <text x="14" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#92400E">🌙 深夜手当 (+25%)</text>
        <text x="14" y="36" font-family="-apple-system,sans-serif" font-size="11" fill="#B45309">22:00以降 = 42h を自動加算</text>
        <text x="426" y="32" font-family="-apple-system,sans-serif" font-size="18" font-weight="900" fill="#92400E" text-anchor="end">+¥12,600</text>
      </g>

      <!-- 残業手当 -->
      <g transform="translate(0, 134)">
        <rect x="0" y="0" width="440" height="48" rx="10" fill="#EEF2FF"/>
        <text x="14" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#3730A3">⏰ 残業手当 (+25%)</text>
        <text x="14" y="36" font-family="-apple-system,sans-serif" font-size="11" fill="#6366F1">週40h超過分 = 8h を自動加算</text>
        <text x="426" y="32" font-family="-apple-system,sans-serif" font-size="18" font-weight="900" fill="#3730A3" text-anchor="end">+¥2,400</text>
      </g>

      <!-- 交通費 -->
      <g transform="translate(0, 190)">
        <rect x="0" y="0" width="440" height="48" rx="10" fill="#F8FAFC"/>
        <text x="14" y="20" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#475569">🚃 交通費</text>
        <text x="14" y="36" font-family="-apple-system,sans-serif" font-size="11" fill="#94A3B8">片道 500円 × 18日</text>
        <text x="426" y="32" font-family="-apple-system,sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="end">+¥9,000</text>
      </g>

      <!-- 合計 -->
      <g transform="translate(0, 256)">
        <rect x="0" y="0" width="440" height="78" rx="14" fill="url(#payGrad)"/>
        <text x="14" y="28" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#fff">💵 8月の支給額</text>
        <text x="14" y="58" font-family="-apple-system,sans-serif" font-size="11" fill="rgba(255,255,255,.85)">手取り (税控除後の概算)</text>
        <text x="426" y="50" font-family="-apple-system,sans-serif" font-size="32" font-weight="900" fill="#fff" text-anchor="end">¥153,600</text>
      </g>

      <!-- フッター -->
      <text x="220" y="358" font-family="-apple-system,sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">労基法 第37条 準拠 / 給与計算ミス 0 を実現</text>
    </g>
  </g>

  <!-- Left features -->
  <g transform="translate(40, 180)" font-family="-apple-system,sans-serif" fill="#fff">
    <text x="0" y="0" font-size="16" font-weight="900">自動加算</text>
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="13" font-weight="700">🌙 深夜 +25%</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">22:00〜翌5:00</text>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="13" font-weight="700">⏰ 残業 +25%</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">週40h超過分</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" font-size="13" font-weight="700">🎌 休日 +35%</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">法定休日労働</text>
    </g>
  </g>

  <!-- Right features -->
  <g transform="translate(920, 180)" font-family="-apple-system,sans-serif" fill="#fff">
    <text x="0" y="0" font-size="16" font-weight="900">解決する課題</text>
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="13" font-weight="700">✅ 給与計算ミス 0</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">手計算の人為ミス撲滅</text>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="13" font-weight="700">✅ 月末作業 1/10</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">5時間 → 30分</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" font-size="13" font-weight="700">✅ スタッフ信頼</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">給与トラブル撲滅</text>
    </g>
  </g>
</svg>
