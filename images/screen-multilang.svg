<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgLang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="phShadowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgLang)"/>

  <text x="640" y="80" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#fff" text-anchor="middle">5 言語完全対応 (外国人スタッフ採用に強い)</text>
  <text x="640" y="110" font-family="-apple-system, sans-serif" font-size="14" fill="#A5F3FC" text-anchor="middle" letter-spacing="3">MULTI-LANGUAGE SUPPORT</text>

  <!-- Phone -->
  <g transform="translate(440, 150)" filter="url(#phShadowL)">
    <rect x="0" y="0" width="400" height="540" rx="48" fill="#0F172A"/>
    <rect x="12" y="12" width="376" height="516" rx="36" fill="#FFFFFF"/>
    <rect x="160" y="12" width="80" height="20" rx="10" fill="#0F172A"/>

    <!-- Status -->
    <g transform="translate(28, 50)">
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">19:42</text>
      <text x="320" y="14" font-family="-apple-system, sans-serif" font-size="11" fill="#0F172A">📶 🔋</text>
    </g>

    <!-- Header -->
    <g transform="translate(28, 90)">
      <text x="0" y="22" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#0F172A">🌐 言語設定 / Language</text>
    </g>

    <!-- JA -->
    <g transform="translate(28, 130)">
      <rect x="0" y="0" width="344" height="56" rx="14" fill="#EFF6FF" stroke="url(#langGrad)" stroke-width="2"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="22">🇯🇵</text>
      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">日本語</text>
      <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">Japanese (default)</text>
      <text x="320" y="34" font-family="-apple-system, sans-serif" font-size="16" fill="#06B6D4">✓</text>
    </g>

    <!-- EN -->
    <g transform="translate(28, 198)">
      <rect x="0" y="0" width="344" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="22">🇺🇸</text>
      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">English</text>
      <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">英語 / イングリッシュ</text>
    </g>

    <!-- ZH -->
    <g transform="translate(28, 266)">
      <rect x="0" y="0" width="344" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="22">🇨🇳</text>
      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">中文 (简体)</text>
      <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">中国語 / Chinese</text>
    </g>

    <!-- KO -->
    <g transform="translate(28, 334)">
      <rect x="0" y="0" width="344" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="22">🇰🇷</text>
      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">한국어</text>
      <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">韓国語 / Korean</text>
    </g>

    <!-- VI -->
    <g transform="translate(28, 402)">
      <rect x="0" y="0" width="344" height="56" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="22" font-family="-apple-system, sans-serif" font-size="22">🇻🇳</text>
      <text x="60" y="22" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0F172A">Tiếng Việt</text>
      <text x="60" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">ベトナム語</text>
    </g>

    <!-- Footer -->
    <g transform="translate(28, 480)">
      <text x="172" y="0" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">シフト提出・打刻・通知・給与照会</text>
      <text x="172" y="16" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">全て母国語で操作可能</text>
    </g>
  </g>

  <!-- Left -->
  <g transform="translate(60, 180)" font-family="-apple-system, sans-serif" fill="#fff">
    <text x="0" y="0" font-size="18" font-weight="900">解決する課題</text>
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-size="14" font-weight="700">❌ 言葉の壁で雇えない</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">日本語 NG でも採用可</text>
    </g>
    <g transform="translate(0, 90)">
      <text x="0" y="0" font-size="14" font-weight="700">❌ シフト連絡が伝わらない</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">プッシュ通知も多言語</text>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-size="14" font-weight="700">❌ 給与の説明できない</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">明細PDFも多言語出力</text>
    </g>
  </g>

  <!-- Right -->
  <g transform="translate(900, 180)" font-family="-apple-system, sans-serif" fill="#fff">
    <text x="0" y="0" font-size="18" font-weight="900">業界唯一の対応</text>
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-size="14" font-weight="700">🌏 全画面 翻訳済み</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">UI 1,200項目を手動チューニング</text>
    </g>
    <g transform="translate(0, 90)">
      <text x="0" y="0" font-size="14" font-weight="700">📲 通知も多言語</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">メール通知の文面も切替</text>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-size="14" font-weight="700">💵 給与明細 多言語</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">PDF を母国語で出力</text>
    </g>
    <g transform="translate(0, 190)">
      <text x="0" y="0" font-size="14" font-weight="700">🎓 採用率向上</text>
      <text x="0" y="20" font-size="11" fill="#A5F3FC">留学生・技能実習生の戦力化</text>
    </g>
  </g>
</svg>
