<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>GPS打刻画面 — RAKURAKU</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4 landscape;margin:0}
html,body{width:297mm;height:210mm;background:#fff;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.frame{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.frame img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.controls{position:fixed;top:10px;right:10px;background:#fff;padding:10px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:9999;font-family:-apple-system,sans-serif}
.controls button{background:#4F46E5;color:#fff;border:none;padding:9px 18px;border-radius:5px;font-weight:bold;cursor:pointer;font-size:13px}
@media print{.controls{display:none}}
</style>
</head>
<body>
<div class="controls">
  <button onclick="window.print()">📄 PDFとして保存</button>
</div>
<div class="frame">
  <img src="screen-timecard.svg" alt="RAKURAKU GPS打刻画面" />
</div>
</body>
</html>
