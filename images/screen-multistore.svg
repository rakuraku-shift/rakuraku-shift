<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgMS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="msGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadowMS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgMS)"/>

  <text x="640" y="80" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#fff" text-anchor="middle">本部ダッシュボード (多店舗チェーン向け)</text>
  <text x="640" y="110" font-family="-apple-system, sans-serif" font-size="14" fill="#C7D2FE" text-anchor="middle" letter-spacing="3">HQ MULTI-STORE DASHBOARD</text>

  <!-- Desktop Mockup -->
  <g transform="translate(140, 150)" filter="url(#shadowMS)">
    <!-- Browser frame -->
    <rect x="0" y="0" width="1000" height="540" rx="14" fill="#0F172A"/>
    <rect x="0" y="0" width="1000" height="36" rx="14" fill="#1E293B"/>
    <circle cx="20" cy="18" r="6" fill="#EF4444"/>
    <circle cx="42" cy="18" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="18" r="6" fill="#10B981"/>
    <rect x="100" y="9" width="500" height="18" rx="9" fill="#0F172A"/>
    <text x="120" y="22" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">🔒 rakuraku-shift-production.up.railway.app/hq-dashboard</text>

    <!-- Content area -->
    <rect x="8" y="44" width="984" height="488" rx="8" fill="#F8FAFC"/>

    <!-- Sidebar -->
    <rect x="8" y="44" width="200" height="488" fill="#0F172A"/>
    <g transform="translate(20, 60)" font-family="-apple-system, sans-serif" fill="#fff">
      <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#msGrad)"/>
      <text x="18" y="25" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">R</text>
      <text x="48" y="16" font-size="14" font-weight="900">RAKURAKU</text>
      <text x="48" y="30" font-size="9" fill="#A5B4FC">HQ ダッシュボード</text>
    </g>
    <g transform="translate(20, 120)" font-family="-apple-system, sans-serif" fill="#94A3B8" font-size="11">
      <rect x="-10" y="-12" width="180" height="30" rx="6" fill="rgba(99,102,241,0.2)"/>
      <text x="0" y="6" font-weight="700" fill="#C7D2FE">📊 全店サマリー</text>
      <text x="0" y="40" font-weight="600">🏪 店舗一覧 (8)</text>
      <text x="0" y="70" font-weight="600">👥 スタッフ管理</text>
      <text x="0" y="100" font-weight="600">💰 給与一括処理</text>
      <text x="0" y="130" font-weight="600">📈 経営分析</text>
      <text x="0" y="160" font-weight="600">⚙️ 本部設定</text>
    </g>

    <!-- Main area -->
    <!-- Title -->
    <g transform="translate(232, 70)" font-family="-apple-system, sans-serif">
      <text x="0" y="0" font-size="20" font-weight="900" fill="#0F172A">本部ダッシュボード — 全 8 店舗</text>
      <text x="0" y="20" font-size="11" fill="#64748B">2026 年 6 月 5 日 19:42 更新</text>
    </g>

    <!-- KPI cards -->
    <g transform="translate(232, 116)">
      <rect x="0" y="0" width="168" height="80" rx="12" fill="#fff" stroke="#E2E8F0"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="2">月間 売上合計</text>
      <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#0F172A">¥38.5M</text>
      <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981">▲ 前月比 +8.2%</text>
    </g>
    <g transform="translate(412, 116)">
      <rect x="0" y="0" width="168" height="80" rx="12" fill="#fff" stroke="#E2E8F0"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="2">平均 人件費率</text>
      <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#0F172A">29.1%</text>
      <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981">▼ 前月比 -1.4pt</text>
    </g>
    <g transform="translate(592, 116)">
      <rect x="0" y="0" width="168" height="80" rx="12" fill="#fff" stroke="#E2E8F0"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="2">総スタッフ数</text>
      <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#0F172A">168 名</text>
      <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#10B981">▲ +12 名</text>
    </g>
    <g transform="translate(772, 116)">
      <rect x="0" y="0" width="168" height="80" rx="12" fill="#fff" stroke="#E2E8F0"/>
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#64748B" letter-spacing="2">労基法アラート</text>
      <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#DC2626">3 件</text>
      <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#DC2626">要対応</text>
    </g>

    <!-- Stores list -->
    <g transform="translate(232, 216)" font-family="-apple-system, sans-serif">
      <text x="0" y="0" font-size="14" font-weight="900" fill="#0F172A">店舗別サマリー</text>
    </g>

    <!-- Table -->
    <g transform="translate(232, 232)">
      <rect x="0" y="0" width="708" height="32" rx="6" fill="#F1F5F9"/>
      <text x="14" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569">店舗</text>
      <text x="220" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569">売上</text>
      <text x="340" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569">人件費率</text>
      <text x="460" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569">スタッフ</text>
      <text x="560" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569">アラート</text>
      <text x="660" y="20" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#475569">操作</text>
    </g>

    <g transform="translate(232, 270)" font-family="-apple-system, sans-serif" font-size="11">
      <!-- row 1 -->
      <rect x="0" y="0" width="708" height="32" fill="#fff"/>
      <text x="14" y="20" font-weight="700" fill="#0F172A">🏪 港区本店</text>
      <text x="220" y="20" fill="#0F172A">¥6.4M</text>
      <text x="340" y="20" fill="#10B981">27.2%</text>
      <text x="460" y="20" fill="#0F172A">28名</text>
      <rect x="556" y="6" width="44" height="20" rx="10" fill="#DCFCE7"/>
      <text x="578" y="20" fill="#16A34A" text-anchor="middle" font-size="10" font-weight="700">0</text>
      <text x="660" y="20" fill="#4F46E5">詳細 →</text>
      <!-- row 2 -->
      <rect x="0" y="34" width="708" height="32" fill="#F8FAFC"/>
      <text x="14" y="54" font-weight="700" fill="#0F172A">🏪 渋谷店</text>
      <text x="220" y="54" fill="#0F172A">¥5.8M</text>
      <text x="340" y="54" fill="#10B981">28.4%</text>
      <text x="460" y="54" fill="#0F172A">22名</text>
      <rect x="556" y="40" width="44" height="20" rx="10" fill="#FEF3C7"/>
      <text x="578" y="54" fill="#D97706" text-anchor="middle" font-size="10" font-weight="700">1</text>
      <text x="660" y="54" fill="#4F46E5">詳細 →</text>
      <!-- row 3 -->
      <rect x="0" y="68" width="708" height="32" fill="#fff"/>
      <text x="14" y="88" font-weight="700" fill="#0F172A">🏪 新宿店</text>
      <text x="220" y="88" fill="#0F172A">¥4.2M</text>
      <text x="340" y="88" fill="#F59E0B">31.8%</text>
      <text x="460" y="88" fill="#0F172A">18名</text>
      <rect x="556" y="74" width="44" height="20" rx="10" fill="#FEE2E2"/>
      <text x="578" y="88" fill="#DC2626" text-anchor="middle" font-size="10" font-weight="700">2</text>
      <text x="660" y="88" fill="#4F46E5">詳細 →</text>
      <!-- row 4 -->
      <rect x="0" y="102" width="708" height="32" fill="#F8FAFC"/>
      <text x="14" y="122" font-weight="700" fill="#0F172A">🏪 銀座店</text>
      <text x="220" y="122" fill="#0F172A">¥7.1M</text>
      <text x="340" y="122" fill="#10B981">26.8%</text>
      <text x="460" y="122" fill="#0F172A">24名</text>
      <rect x="556" y="108" width="44" height="20" rx="10" fill="#DCFCE7"/>
      <text x="578" y="122" fill="#16A34A" text-anchor="middle" font-size="10" font-weight="700">0</text>
      <text x="660" y="122" fill="#4F46E5">詳細 →</text>
      <!-- row 5 -->
      <rect x="0" y="136" width="708" height="32" fill="#fff"/>
      <text x="14" y="156" font-weight="700" fill="#0F172A">🏪 表参道店</text>
      <text x="220" y="156" fill="#0F172A">¥5.0M</text>
      <text x="340" y="156" fill="#10B981">29.6%</text>
      <text x="460" y="156" fill="#0F172A">20名</text>
      <rect x="556" y="142" width="44" height="20" rx="10" fill="#DCFCE7"/>
      <text x="578" y="156" fill="#16A34A" text-anchor="middle" font-size="10" font-weight="700">0</text>
      <text x="660" y="156" fill="#4F46E5">詳細 →</text>
    </g>
  </g>
</svg>
