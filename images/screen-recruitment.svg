<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgRec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="phShadowR" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgRec)"/>

  <text x="640" y="80" font-family="-apple-system, sans-serif" font-size="32" font-weight="900" fill="#fff" text-anchor="middle">スタッフ募集ボード (Timee手数料 月¥40,000削減)</text>
  <text x="640" y="110" font-family="-apple-system, sans-serif" font-size="14" fill="#DDD6FE" text-anchor="middle" letter-spacing="3">INTERNAL STAFF BOARD</text>

  <!-- Phone -->
  <g transform="translate(440, 150)" filter="url(#phShadowR)">
    <rect x="0" y="0" width="400" height="540" rx="48" fill="#0F172A"/>
    <rect x="12" y="12" width="376" height="516" rx="36" fill="#FFFFFF"/>
    <rect x="160" y="12" width="80" height="20" rx="10" fill="#0F172A"/>

    <!-- Status -->
    <g transform="translate(28, 50)">
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">19:42</text>
      <text x="320" y="14" font-family="-apple-system, sans-serif" font-size="11" fill="#0F172A">📶 🔋</text>
    </g>

    <!-- Header -->
    <g transform="translate(28, 88)">
      <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11" fill="#94A3B8">3段階自動募集</text>
      <text x="0" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#0F172A">🎯 不足コマ 募集中</text>
    </g>

    <!-- Step 1 -->
    <g transform="translate(28, 138)">
      <rect x="0" y="0" width="344" height="100" rx="14" fill="#F5F3FF" stroke="url(#recGrad)" stroke-width="2"/>
      <circle cx="32" cy="32" r="16" fill="url(#recGrad)"/>
      <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">1</text>
      <text x="60" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">既存スタッフに通知</text>
      <text x="60" y="46" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">メールで「6/8 22-翌2 入れる人?」</text>
      <text x="60" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#10B981">✓ 3名応募 / 1コマ確保</text>
      <text x="60" y="88" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">手数料 ¥0 円</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(28, 252)">
      <rect x="0" y="0" width="344" height="100" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="32" cy="32" r="16" fill="#F59E0B"/>
      <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">2</text>
      <text x="60" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">時給+100円募集</text>
      <text x="60" y="46" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">5分後も埋まらない → 自動アップ</text>
      <text x="60" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#D97706">✓ 1名応募 / 残2コマ</text>
      <text x="60" y="88" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">追加コスト ¥800/日</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(28, 366)">
      <rect x="0" y="0" width="344" height="100" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
      <circle cx="32" cy="32" r="16" fill="#3B82F6"/>
      <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">3</text>
      <text x="60" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Timee/シェアフル配信</text>
      <text x="60" y="46" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">最終手段。Chrome 拡張で自動入力</text>
      <text x="60" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1E40AF">✓ 1名確保 / 全コマ充足</text>
      <text x="60" y="88" font-family="-apple-system, sans-serif" font-size="9" fill="#94A3B8">手数料 ¥1,500-2,500/件</text>
    </g>

    <!-- Footer -->
    <g transform="translate(28, 484)">
      <text x="172" y="0" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">90%は STEP 1-2 で充足</text>
      <text x="172" y="16" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">外部手数料 月¥40,000削減 事例</text>
    </g>
  </g>

  <!-- Left -->
  <g transform="translate(60, 180)" font-family="-apple-system, sans-serif" fill="#fff">
    <text x="0" y="0" font-size="18" font-weight="900">解決する課題</text>
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-size="14" font-weight="700">❌ Timee 手数料が高い</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">毎月4-6万円の固定費</text>
    </g>
    <g transform="translate(0, 90)">
      <text x="0" y="0" font-size="14" font-weight="700">❌ 急な欠勤の穴埋め</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">電話とLINE地獄</text>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-size="14" font-weight="700">❌ 新人の質が読めない</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">既存スタッフの方が確実</text>
    </g>
  </g>

  <!-- Right -->
  <g transform="translate(900, 180)" font-family="-apple-system, sans-serif" fill="#fff">
    <text x="0" y="0" font-size="18" font-weight="900">RAKURAKU だけの仕組み</text>
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-size="14" font-weight="700">⚡ 自動エスカレーション</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">5分ごとに条件アップ</text>
    </g>
    <g transform="translate(0, 90)">
      <text x="0" y="0" font-size="14" font-weight="700">📊 90%は内部充足</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">Timee依存をやめられる</text>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-size="14" font-weight="700">🤝 Chrome 拡張連携</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">Timee/シェアフル 自動入力</text>
    </g>
    <g transform="translate(0, 190)">
      <text x="0" y="0" font-size="14" font-weight="700">💰 月¥40,000+ 削減</text>
      <text x="0" y="20" font-size="11" fill="#DDD6FE">既存事例での実数値</text>
    </g>
  </g>
</svg>
