<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgMail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="mailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="mailShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgMail)"/>

  <text x="640" y="80" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">📧 メール通知</text>
  <text x="640" y="112" font-family="-apple-system,sans-serif" font-size="14" fill="#A5B4FC" text-anchor="middle" letter-spacing="3">SHIFT NOTIFICATIONS BY EMAIL</text>

  <g transform="translate(440, 155)" filter="url(#mailShadow)">
    <rect x="0" y="0" width="400" height="540" rx="48" fill="#0F172A"/>
    <rect x="12" y="12" width="376" height="516" rx="36" fill="#F0F2F5"/>
    <rect x="160" y="12" width="80" height="20" rx="10" fill="#0F172A"/>

    <rect x="12" y="32" width="376" height="56" fill="#fff"/>
    <text x="50" y="64" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#0F172A">📥 シフト通知 (8)</text>
    <circle cx="370" cy="60" r="14" fill="#6366F1"/>
    <text x="370" y="64" font-family="-apple-system,sans-serif" font-size="12" font-weight="900" fill="#fff" text-anchor="middle">≡</text>
    <line x1="12" y1="88" x2="388" y2="88" stroke="#E5E7EB" stroke-width="0.5"/>

    <g transform="translate(20, 102)">
      <circle cx="14" cy="14" r="14" fill="url(#mailGrad)"/>
      <text x="14" y="19" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">R</text>
      <text x="36" y="14" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#64748B">RAKURAKU</text>
      <rect x="36" y="22" width="280" height="92" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/>
      <text x="50" y="42" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#0F172A">📅 9月のシフトが確定しました</text>
      <line x1="50" y1="50" x2="300" y2="50" stroke="#F0F2F5" stroke-width="1"/>
      <text x="50" y="68" font-family="-apple-system,sans-serif" font-size="11" fill="#475569">スタッフA 様</text>
      <text x="50" y="84" font-family="-apple-system,sans-serif" font-size="11" fill="#475569">出勤: 18 日 / 計 108 時間</text>
      <text x="50" y="100" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#4F46E5">→ 詳細を確認 (タップ)</text>
    </g>

    <g transform="translate(20, 210)">
      <circle cx="14" cy="14" r="14" fill="url(#mailGrad)"/>
      <text x="14" y="19" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">R</text>
      <text x="36" y="14" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#64748B">RAKURAKU</text>
      <rect x="36" y="22" width="280" height="106" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="50" y="42" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#92400E">⚡ 急募 (時給 +500円)</text>
      <line x1="50" y1="50" x2="300" y2="50" stroke="#FBBF24" stroke-width="1"/>
      <text x="50" y="68" font-family="-apple-system,sans-serif" font-size="11" fill="#92400E">9/15(金) 18:00 - 23:00</text>
      <text x="50" y="84" font-family="-apple-system,sans-serif" font-size="11" fill="#92400E">時給 1,200 → 1,700円 (期間限定)</text>
      <rect x="50" y="96" width="100" height="24" rx="12" fill="#D97706"/>
      <text x="100" y="112" font-family="-apple-system,sans-serif" font-size="11" font-weight="900" fill="#fff" text-anchor="middle">受諾する</text>
      <rect x="158" y="96" width="100" height="24" rx="12" fill="#fff" stroke="#D97706" stroke-width="1"/>
      <text x="208" y="112" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">スキップ</text>
    </g>

    <g transform="translate(0, 340)">
      <rect x="200" y="0" width="180" height="40" rx="14" fill="#6366F1"/>
      <text x="290" y="26" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">✓ OK 受けます!</text>
    </g>

    <g transform="translate(20, 396)">
      <circle cx="14" cy="14" r="14" fill="url(#mailGrad)"/>
      <text x="14" y="19" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">R</text>
      <rect x="36" y="0" width="200" height="60" rx="14" fill="#fff" stroke="#E5E7EB" stroke-width="0.5"/>
      <text x="50" y="22" font-family="-apple-system,sans-serif" font-size="12" font-weight="900" fill="#16A34A">✅ 受諾しました!</text>
      <text x="50" y="40" font-family="-apple-system,sans-serif" font-size="10" fill="#475569">店長へ自動通知済み</text>
      <text x="50" y="54" font-family="-apple-system,sans-serif" font-size="10" fill="#94A3B8">9/15 18:00 出勤予定</text>
    </g>

    <g transform="translate(12, 480)">
      <rect x="0" y="0" width="376" height="48" fill="#fff"/>
      <line x1="0" y1="0" x2="376" y2="0" stroke="#E5E7EB" stroke-width="1"/>
      <text x="70" y="28" font-family="-apple-system,sans-serif" font-size="16" fill="#6366F1" text-anchor="middle">🔔</text>
      <text x="70" y="42" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" fill="#6366F1" text-anchor="middle">通知</text>
      <text x="188" y="28" font-family="-apple-system,sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">📅</text>
      <text x="188" y="42" font-family="-apple-system,sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">シフト</text>
      <text x="306" y="28" font-family="-apple-system,sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">💰</text>
      <text x="306" y="42" font-family="-apple-system,sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">給与</text>
    </g>
  </g>

  <g transform="translate(80, 200)" font-family="-apple-system,sans-serif" fill="#fff">
    <text x="0" y="0" font-size="16" font-weight="900">通知の種類</text>
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="13" font-weight="700">📅 シフト確定</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">月初に一括配信</text>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="13" font-weight="700">⚡ 急募依頼</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">時給アップ付きで送信</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" font-size="13" font-weight="700">💰 給与明細</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">月末自動配信</text>
    </g>
    <g transform="translate(0, 152)">
      <text x="0" y="0" font-size="13" font-weight="700">⏰ 出勤リマインド</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">1時間前に通知</text>
    </g>
  </g>

  <g transform="translate(880, 200)" font-family="-apple-system,sans-serif" fill="#fff">
    <text x="0" y="0" font-size="16" font-weight="900">採用するメリット</text>
    <g transform="translate(0, 32)">
      <text x="0" y="0" font-size="13" font-weight="700">📧 アプリ不要</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">メールが届けば完結</text>
    </g>
    <g transform="translate(0, 72)">
      <text x="0" y="0" font-size="13" font-weight="700">⚡ 即レス可能</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">通知から 1 タップ</text>
    </g>
    <g transform="translate(0, 112)">
      <text x="0" y="0" font-size="13" font-weight="700">🌐 多言語対応</text>
      <text x="0" y="18" font-size="10" fill="#A5B4FC">5 言語で送信</text>
    </g>
  </g>
</svg>
