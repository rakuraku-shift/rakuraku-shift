<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgRec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="recGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="recShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgRec)"/>

  <!-- Title -->
  <text x="640" y="80" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">🎯 3 段階 自動募集</text>
  <text x="640" y="112" font-family="-apple-system,sans-serif" font-size="14" fill="#FCD34D" text-anchor="middle" letter-spacing="3">SAVE TIMEE/SHAREFULL FEES</text>

  <!-- 3 ステップフロー -->
  <g transform="translate(70, 175)" filter="url(#recShadow)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="430" rx="20" fill="#fff"/>
      <rect x="0" y="0" width="340" height="80" rx="20" fill="url(#recGreen)"/>
      <rect x="0" y="60" width="340" height="20" fill="url(#recGreen)"/>
      <text x="30" y="34" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#fff" letter-spacing="2">STEP 1</text>
      <text x="30" y="60" font-family="-apple-system,sans-serif" font-size="22" font-weight="900" fill="#fff">既存スタッフへ調整依頼</text>

      <!-- Body -->
      <g transform="translate(24, 110)">
        <rect x="0" y="0" width="292" height="180" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
        <text x="146" y="32" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#15803D" text-anchor="middle">📨 既存メンバーにメール通知</text>
        <line x1="20" y1="50" x2="272" y2="50" stroke="#86EFAC" stroke-width="1"/>
        <text x="20" y="74" font-family="-apple-system,sans-serif" font-size="11" fill="#15803D">「9/15(金) 18-23時 急募」</text>
        <text x="20" y="92" font-family="-apple-system,sans-serif" font-size="11" fill="#15803D">「いつもの時給 +200円 OK?」</text>

        <rect x="20" y="110" width="252" height="50" rx="8" fill="#fff"/>
        <text x="146" y="130" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle">⚡ 平均 17 分で誰かが受諾</text>
        <text x="146" y="148" font-family="-apple-system,sans-serif" font-size="10" fill="#16A34A" text-anchor="middle">手数料: 0 円</text>
      </g>

      <!-- Cost -->
      <g transform="translate(24, 312)">
        <rect x="0" y="0" width="292" height="84" rx="12" fill="#ECFDF5"/>
        <text x="146" y="28" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#16A34A" text-anchor="middle">💰 手数料</text>
        <text x="146" y="60" font-family="-apple-system,sans-serif" font-size="32" font-weight="900" fill="#15803D" text-anchor="middle">¥0</text>
        <text x="146" y="78" font-family="-apple-system,sans-serif" font-size="10" fill="#16A34A" text-anchor="middle">完全無料</text>
      </g>
    </g>

    <!-- Arrow 1 -->
    <text x="360" y="220" font-family="-apple-system,sans-serif" font-size="40" fill="#FBBF24" text-anchor="middle">→</text>

    <!-- Step 2 -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="340" height="430" rx="20" fill="#fff"/>
      <rect x="0" y="0" width="340" height="80" rx="20" fill="url(#recGrad)"/>
      <rect x="0" y="60" width="340" height="20" fill="url(#recGrad)"/>
      <text x="30" y="34" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#fff" letter-spacing="2">STEP 2</text>
      <text x="30" y="60" font-family="-apple-system,sans-serif" font-size="22" font-weight="900" fill="#fff">社内 時給 UP 募集</text>

      <!-- Body -->
      <g transform="translate(24, 110)">
        <rect x="0" y="0" width="292" height="180" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="146" y="32" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#92400E" text-anchor="middle">⚡ 社内全員にプッシュ通知</text>
        <line x1="20" y1="50" x2="272" y2="50" stroke="#FCD34D" stroke-width="1"/>
        <text x="20" y="74" font-family="-apple-system,sans-serif" font-size="11" fill="#92400E">「9/15 急募 時給 +500円!」</text>
        <text x="20" y="92" font-family="-apple-system,sans-serif" font-size="11" fill="#92400E">「経験者優遇 / 早い者勝ち」</text>

        <rect x="20" y="110" width="252" height="50" rx="8" fill="#fff"/>
        <text x="146" y="130" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle">⚡ 平均 32 分で受諾</text>
        <text x="146" y="148" font-family="-apple-system,sans-serif" font-size="10" fill="#D97706" text-anchor="middle">手数料: 0 円 (時給 UP のみ)</text>
      </g>

      <!-- Cost -->
      <g transform="translate(24, 312)">
        <rect x="0" y="0" width="292" height="84" rx="12" fill="#FEF3C7"/>
        <text x="146" y="28" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">💰 追加コスト</text>
        <text x="146" y="60" font-family="-apple-system,sans-serif" font-size="32" font-weight="900" fill="#92400E" text-anchor="middle">+¥2,500</text>
        <text x="146" y="78" font-family="-apple-system,sans-serif" font-size="10" fill="#D97706" text-anchor="middle">5h × +500円</text>
      </g>
    </g>

    <!-- Arrow 2 -->
    <text x="740" y="220" font-family="-apple-system,sans-serif" font-size="40" fill="#FBBF24" text-anchor="middle">→</text>

    <!-- Step 3 -->
    <g transform="translate(760, 0)">
      <rect x="0" y="0" width="340" height="430" rx="20" fill="#fff"/>
      <rect x="0" y="0" width="340" height="80" rx="20" fill="#EF4444"/>
      <rect x="0" y="60" width="340" height="20" fill="#EF4444"/>
      <text x="30" y="34" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#fff" letter-spacing="2">STEP 3 (最終手段)</text>
      <text x="30" y="60" font-family="-apple-system,sans-serif" font-size="22" font-weight="900" fill="#fff">Timee / シェアフル</text>

      <!-- Body -->
      <g transform="translate(24, 110)">
        <rect x="0" y="0" width="292" height="180" rx="12" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
        <text x="146" y="32" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#991B1B" text-anchor="middle">🔌 Chrome 拡張で自動投稿</text>
        <line x1="20" y1="50" x2="272" y2="50" stroke="#FCA5A5" stroke-width="1"/>
        <text x="20" y="74" font-family="-apple-system,sans-serif" font-size="11" fill="#991B1B">Timee / シェアフル / バイトル</text>
        <text x="20" y="92" font-family="-apple-system,sans-serif" font-size="11" fill="#991B1B">3 サイトに同時投稿で取りこぼし 0</text>

        <rect x="20" y="110" width="252" height="50" rx="8" fill="#fff"/>
        <text x="146" y="130" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#991B1B" text-anchor="middle">⚠️ 平均 1-3 時間で人員確保</text>
        <text x="146" y="148" font-family="-apple-system,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle">高額手数料 (時給の 30-40%)</text>
      </g>

      <!-- Cost -->
      <g transform="translate(24, 312)">
        <rect x="0" y="0" width="292" height="84" rx="12" fill="#FEE2E2"/>
        <text x="146" y="28" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">💰 手数料</text>
        <text x="146" y="60" font-family="-apple-system,sans-serif" font-size="32" font-weight="900" fill="#991B1B" text-anchor="middle">¥1,500〜2,500</text>
        <text x="146" y="78" font-family="-apple-system,sans-serif" font-size="10" fill="#DC2626" text-anchor="middle">1 件あたり</text>
      </g>
    </g>
  </g>

  <!-- Summary -->
  <g transform="translate(640, 640)" font-family="-apple-system,sans-serif" fill="#fff" text-anchor="middle">
    <text x="0" y="0" font-size="18" font-weight="900">この 3 段階フローで <tspan fill="#FBBF24">外部募集コスト 月 40,000 円 削減</tspan>した事例あり</text>
  </g>
</svg>
