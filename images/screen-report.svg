<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgReport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="repGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="repShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgReport)"/>

  <!-- Title -->
  <text x="640" y="80" font-family="-apple-system,'Hiragino Sans',sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">📊 月次レポート</text>
  <text x="640" y="112" font-family="-apple-system,sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle" letter-spacing="3">MONTHLY LABOR COST ANALYTICS</text>

  <!-- Desktop dashboard -->
  <g transform="translate(160, 155)" filter="url(#repShadow)">
    <rect x="0" y="0" width="960" height="510" rx="14" fill="#fff"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="960" height="50" rx="14" fill="#0F172A"/>
    <rect x="0" y="36" width="960" height="14" fill="#0F172A"/>
    <text x="20" y="32" font-family="-apple-system,sans-serif" font-size="14" font-weight="900" fill="#fff">📊 9 月レポート / BAR RAKURAKU</text>
    <text x="940" y="32" font-family="-apple-system,sans-serif" font-size="12" fill="#94A3B8" text-anchor="end">PDF Export ↓</text>

    <!-- 4 KPI cards -->
    <g transform="translate(20, 70)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="220" height="100" rx="10" fill="#EFF6FF"/>
      <text x="14" y="22" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">人件費 (8月)</text>
      <text x="14" y="58" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#1E40AF">¥847,200</text>
      <text x="14" y="80" font-family="-apple-system,sans-serif" font-size="10" fill="#3B82F6">↓ 前月比 -8% (-¥73,000)</text>

      <!-- KPI 2 -->
      <rect x="230" y="0" width="220" height="100" rx="10" fill="#F0FDF4"/>
      <text x="244" y="22" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#16A34A">売上連動 人件費率</text>
      <text x="244" y="58" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#15803D">26.4%</text>
      <text x="244" y="80" font-family="-apple-system,sans-serif" font-size="10" fill="#22C55E">↓ 目標 28% を達成 ✓</text>

      <!-- KPI 3 -->
      <rect x="460" y="0" width="220" height="100" rx="10" fill="#FFFBEB"/>
      <text x="474" y="22" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#B45309">総労働時間</text>
      <text x="474" y="58" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#92400E">682 h</text>
      <text x="474" y="80" font-family="-apple-system,sans-serif" font-size="10" fill="#D97706">スタッフ 7 名 / 平均 97h</text>

      <!-- KPI 4 -->
      <rect x="690" y="0" width="220" height="100" rx="10" fill="#FAF5FF"/>
      <text x="704" y="22" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7C3AED">深夜手当 比率</text>
      <text x="704" y="58" font-family="-apple-system,sans-serif" font-size="28" font-weight="900" fill="#6B21A8">14.2%</text>
      <text x="704" y="80" font-family="-apple-system,sans-serif" font-size="10" fill="#A78BFA">¥120,200 (22時以降)</text>
    </g>

    <!-- Bar chart -->
    <g transform="translate(20, 200)">
      <text x="0" y="0" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#0F172A">📈 売上 vs 人件費 (週次)</text>

      <!-- Y axis lines -->
      <g stroke="#E2E8F0" stroke-width="1">
        <line x1="60" y1="40" x2="540" y2="40"/>
        <line x1="60" y1="100" x2="540" y2="100"/>
        <line x1="60" y1="160" x2="540" y2="160"/>
        <line x1="60" y1="220" x2="540" y2="220"/>
      </g>
      <g font-family="-apple-system,sans-serif" font-size="9" fill="#94A3B8" text-anchor="end">
        <text x="55" y="44">¥1.2M</text>
        <text x="55" y="104">¥0.8M</text>
        <text x="55" y="164">¥0.4M</text>
        <text x="55" y="224">¥0</text>
      </g>

      <!-- Bars Week 1 -->
      <rect x="80" y="60" width="35" height="160" fill="url(#barGrad)" rx="3"/>
      <rect x="120" y="135" width="35" height="85" fill="url(#barGrad2)" rx="3"/>
      <text x="117" y="240" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">W1</text>

      <!-- Bars Week 2 -->
      <rect x="180" y="48" width="35" height="172" fill="url(#barGrad)" rx="3"/>
      <rect x="220" y="120" width="35" height="100" fill="url(#barGrad2)" rx="3"/>
      <text x="217" y="240" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">W2</text>

      <!-- Bars Week 3 -->
      <rect x="280" y="72" width="35" height="148" fill="url(#barGrad)" rx="3"/>
      <rect x="320" y="142" width="35" height="78" fill="url(#barGrad2)" rx="3"/>
      <text x="317" y="240" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">W3</text>

      <!-- Bars Week 4 -->
      <rect x="380" y="56" width="35" height="164" fill="url(#barGrad)" rx="3"/>
      <rect x="420" y="128" width="35" height="92" fill="url(#barGrad2)" rx="3"/>
      <text x="417" y="240" font-family="-apple-system,sans-serif" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">W4</text>

      <!-- Legend -->
      <g transform="translate(0, 260)">
        <rect x="80" y="0" width="14" height="14" fill="url(#barGrad)" rx="2"/>
        <text x="100" y="12" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#475569">売上</text>
        <rect x="180" y="0" width="14" height="14" fill="url(#barGrad2)" rx="2"/>
        <text x="200" y="12" font-family="-apple-system,sans-serif" font-size="11" font-weight="700" fill="#475569">人件費</text>
      </g>
    </g>

    <!-- Right panel - スタッフ別 -->
    <g transform="translate(610, 200)">
      <text x="0" y="0" font-family="-apple-system,sans-serif" font-size="13" font-weight="900" fill="#0F172A">👥 スタッフ別 人件費</text>

      <!-- Staff rows -->
      <g transform="translate(0, 24)" font-family="-apple-system,sans-serif" font-size="11">
        <g transform="translate(0, 0)">
          <text x="0" y="14" font-weight="700" fill="#0F172A">スタッフA</text>
          <rect x="80" y="4" width="180" height="14" rx="7" fill="#F1F5F9"/>
          <rect x="80" y="4" width="160" height="14" rx="7" fill="url(#barGrad)"/>
          <text x="270" y="14" font-weight="700" fill="#1E40AF" text-anchor="start">¥184k</text>
        </g>
        <g transform="translate(0, 32)">
          <text x="0" y="14" font-weight="700" fill="#0F172A">スタッフB</text>
          <rect x="80" y="4" width="180" height="14" rx="7" fill="#F1F5F9"/>
          <rect x="80" y="4" width="135" height="14" rx="7" fill="url(#barGrad)"/>
          <text x="270" y="14" font-weight="700" fill="#1E40AF" text-anchor="start">¥152k</text>
        </g>
        <g transform="translate(0, 64)">
          <text x="0" y="14" font-weight="700" fill="#0F172A">スタッフC</text>
          <rect x="80" y="4" width="180" height="14" rx="7" fill="#F1F5F9"/>
          <rect x="80" y="4" width="118" height="14" rx="7" fill="url(#barGrad)"/>
          <text x="270" y="14" font-weight="700" fill="#1E40AF" text-anchor="start">¥138k</text>
        </g>
        <g transform="translate(0, 96)">
          <text x="0" y="14" font-weight="700" fill="#0F172A">スタッフD</text>
          <rect x="80" y="4" width="180" height="14" rx="7" fill="#F1F5F9"/>
          <rect x="80" y="4" width="105" height="14" rx="7" fill="url(#barGrad)"/>
          <text x="270" y="14" font-weight="700" fill="#1E40AF" text-anchor="start">¥127k</text>
        </g>
        <g transform="translate(0, 128)">
          <text x="0" y="14" font-weight="700" fill="#0F172A">スタッフE</text>
          <rect x="80" y="4" width="180" height="14" rx="7" fill="#F1F5F9"/>
          <rect x="80" y="4" width="92" height="14" rx="7" fill="url(#barGrad)"/>
          <text x="270" y="14" font-weight="700" fill="#1E40AF" text-anchor="start">¥118k</text>
        </g>
      </g>

      <!-- Insight box -->
      <g transform="translate(0, 192)">
        <rect x="0" y="0" width="320" height="60" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="14" y="22" font-family="-apple-system,sans-serif" font-size="11" font-weight="900" fill="#92400E">💡 改善提案</text>
        <text x="14" y="42" font-family="-apple-system,sans-serif" font-size="10" fill="#92400E">スタッフAの深夜帯が多い → 平日昼に振替で月¥18k削減</text>
      </g>
    </g>
  </g>
</svg>
