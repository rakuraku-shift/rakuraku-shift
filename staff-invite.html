<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>スタッフ招待 (店長専用) — RAKURAKU</title>
<meta name="description" content="スタッフを招待する QR コード・URL を生成。LINE で送って 1 タップで参加できる。" />
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#DC2626">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --red:#DC2626; --green:#10B981;
    --slate-900:#0F172A; --slate-700:#334155; --slate-500:#64748B;
    --slate-200:#E2E8F0; --slate-100:#F1F5F9; --slate-50:#F8FAFC;
  }
  html,body{font-family:'Noto Sans JP','Inter',sans-serif;color:var(--slate-900);background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased;}
  a{color:var(--red);}

  .nav{background:#fff;border-bottom:1px solid var(--slate-100);}
  .nav-inner{max-width:680px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;}
  .logo-mark{width:30px;height:30px;background:#DC2626;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;box-shadow:0 4px 12px rgba(220,38,38,.35);}

  .container{max-width:560px;margin:0 auto;padding:30px 24px 60px;}
  .hero{text-align:center;margin-bottom:24px;}
  .hero h1{font-size:24px;font-weight:900;letter-spacing:-.01em;margin-bottom:6px;}
  .hero p{font-size:13px;color:var(--slate-500);}

  .form-card{background:#fff;border:1.5px solid var(--slate-100);border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.04);margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:800;color:var(--slate-700);margin-bottom:5px;letter-spacing:.04em;}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--slate-200);border-radius:10px;font-size:14px;font-family:inherit;outline:none;}
  .field input:focus{border-color:var(--red);}

  .gen-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--red),#F59E0B);color:#fff;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;}

  .result{display:none;}
  .result.show{display:block;}

  .qr-card{background:#fff;border:1.5px solid var(--slate-100);border-radius:18px;padding:24px;text-align:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.04);}
  .qr-card .qr-box{display:inline-block;padding:12px;background:#fff;border:1.5px solid var(--slate-200);border-radius:12px;margin-bottom:12px;}
  .qr-card .qr-box img{display:block;width:200px;height:200px;}
  .qr-card .qr-label{font-size:12px;color:var(--slate-500);font-weight:700;margin-top:6px;}

  .url-card{background:var(--slate-50);border:1.5px solid var(--slate-100);border-radius:14px;padding:18px;margin-bottom:14px;}
  .url-card .lbl{font-size:11px;color:var(--slate-500);font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
  .url-card .url{font-size:11px;font-family:monospace;color:var(--slate-700);word-break:break-all;background:#fff;padding:10px 12px;border-radius:8px;border:1px solid var(--slate-200);margin-bottom:8px;}
  .url-card .actions{display:flex;gap:8px;flex-wrap:wrap;}
  .act{flex:1;min-width:120px;padding:11px 16px;border:1px solid var(--slate-200);background:#fff;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--slate-700);}
  .act:hover{border-color:var(--red);color:var(--red);}
  .act.line{background:#06C755;color:#fff;border-color:transparent;}

  .info{background:#FEF3C7;border:1px solid #FDE68A;border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.85;color:#92400E;}
  .info strong{color:#78350F;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--slate-900);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;display:none;z-index:200;}
  .toast.show{display:block;animation:fadeUp .3s;}
  @keyframes fadeUp{from{opacity:0;transform:translate(-50%, 20px);}to{opacity:1;transform:translateX(-50%);}}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/" class="logo"><span class="logo-mark">R</span><span>RAKURAKU</span></a>
    <a href="/shift.html" style="font-size:12px;color:var(--slate-500);font-weight:700;text-decoration:none;">← シフト管理</a>
  </div>
</header>

<main class="container">
  <div class="hero">
    <h1 data-i18n="invite.title">📨 スタッフを招待</h1>
    <p data-i18n="invite.sub">QR コード or リンクで簡単招待。LINE で送って 1 タップで参加できます</p>
  </div>

  <div class="form-card">
    <div class="field">
      <label>店舗名 (招待リンクに表示されます)</label>
      <input type="text" id="shopName" placeholder="例) BAR FOREST 銀座" />
    </div>
    <div class="field">
      <label>店舗 ID (省略可・自動採番)</label>
      <input type="text" id="shopId" placeholder="例) bar-forest-ginza" />
    </div>
    <button class="gen-btn" onclick="generate()">🔗 招待リンクを生成</button>
  </div>

  <div class="result" id="result">
    <div class="qr-card">
      <div class="qr-box">
        <img id="qrImg" src="" alt="招待 QR" />
      </div>
      <div class="qr-label">📱 スタッフのスマホで読み取って参加</div>
    </div>

    <div class="url-card">
      <div class="lbl">📨 招待 URL</div>
      <div class="url" id="urlText">—</div>
      <div class="actions">
        <button class="act" onclick="copyURL()">📋 URL コピー</button>
        <a class="act line" id="lineLink" target="_blank">🟢 LINE で送る</a>
      </div>
    </div>

    <div class="info">
      💡 <strong>使い方</strong><br>
      ① 上記の URL を LINE / メールで送る<br>
      ② スタッフがタップ → スタッフログイン画面が開く<br>
      ③ 名前 + 4 桁 PIN を入力 → 完了<br>
      ④ 次回からは PIN だけで自動ログイン<br><br>
      🔒 PIN はスタッフ自身が決められます (店長は管理不要)
    </div>
  </div>
</main>

<div class="toast" id="toast">コピーしました</div>

<script>
const BASE = window.location.origin;

function generate(){
  const name = document.getElementById('shopName').value.trim();
  let id = document.getElementById('shopId').value.trim();
  if (!name){
    alert('店舗名を入力してください');
    return;
  }
  if (!id){
    /* 自動 ID 採番 */
    id = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '') || ('shop-' + Date.now().toString(36));
  }

  const url = `${BASE}/staff-login.html?shop=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}`;

  /* QR コードを Google Chart API で生成 */
  const qr = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&margin=8`;
  document.getElementById('qrImg').src = qr;
  document.getElementById('urlText').textContent = url;
  document.getElementById('lineLink').href = `https://line.me/R/msg/text/?${encodeURIComponent('【シフト管理 RAKURAKU】参加リンク\n' + name + '\n\n' + url)}`;
  document.getElementById('result').classList.add('show');
  document.getElementById('result').scrollIntoView({behavior:'smooth', block:'start'});
}

function copyURL(){
  const url = document.getElementById('urlText').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  });
}
</script>

<script src="/i18n.js"></script><script>if(window.RakuI18n){var s=document.createElement("div");s.id="rakuraku-lang-switcher";s.style.cssText="position:fixed;top:12px;right:12px;z-index:9999;background:rgba(0,0,0,.7);border-radius:8px;padding:3px;";document.body.appendChild(s);RakuI18n.buildSwitcher("rakuraku-lang-switcher");}</script></body>
</html>
