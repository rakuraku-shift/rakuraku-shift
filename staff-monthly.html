<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>スタッフ別 月次サマリ — RAKURAKU</title>
<meta name="description" content="スタッフ別の月次勤務時間・給与・出勤率レポート"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#DC2626">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #4F46E5; outline-offset: 2px; border-radius: 4px; }
  :root{--indigo:#4F46E5;--purple:#7C3AED;--indigo-l:#EEF2FF;--emerald:#10B981;--amber:#F59E0B;--rose:#EF4444;
        --slate-900:#0F172A;--slate-700:#334155;--slate-500:#64748B;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--slate-50:#F8FAFC;}
  html,body{font-family:'Noto Sans JP','Inter',sans-serif;color:var(--slate-900);background:var(--slate-50);min-height:100vh;line-height:1.6;}

  .nav{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--slate-100);z-index:10;}
  .nav-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;}
  .logo-mark{width:30px;height:30px;background:#DC2626;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;}

  .container{max-width:1280px;margin:0 auto;padding:24px;}
  .page-header{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  .page-header h1{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-bottom:4px;}
  .page-header .sub{font-size:12px;color:var(--slate-500);font-weight:600;}

  .controls{display:flex;gap:10px;align-items:center;}
  .controls select, .controls input{padding:9px 12px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;}

  .layout{display:grid;grid-template-columns:280px 1fr;gap:18px;}
  @media(max-width:880px){.layout{grid-template-columns:1fr;}}

  .staff-list{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 20px rgba(0,0,0,.04);border:1.5px solid var(--slate-100);max-height:75vh;overflow-y:auto;}
  .staff-list h3{font-size:12px;font-weight:800;color:var(--slate-500);letter-spacing:.04em;margin-bottom:10px;padding:0 8px;}
  .staff-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--slate-700);transition:all .12s;display:flex;justify-content:space-between;align-items:center;}
  .staff-item:hover{background:var(--slate-50);}
  .staff-item.active{background:var(--indigo-l);color:var(--indigo);font-weight:800;}
  .staff-item .badge{font-size:10px;color:var(--slate-500);font-weight:600;background:var(--slate-100);padding:2px 7px;border-radius:10px;}
  .staff-item.active .badge{background:rgba(79,70,229,.15);color:var(--indigo);}

  .main-content{display:flex;flex-direction:column;gap:18px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media(max-width:680px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:#fff;border-radius:12px;padding:14px;border:1.5px solid var(--slate-100);}
  .kpi-label{font-size:10px;font-weight:800;color:var(--slate-500);letter-spacing:.04em;margin-bottom:6px;}
  .kpi-value{font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--slate-900);}
  .kpi-value .unit{font-size:11px;color:var(--slate-500);font-weight:700;margin-left:3px;}
  .kpi-diff{font-size:10px;font-weight:800;margin-top:4px;}
  .kpi-diff.up{color:var(--emerald);}
  .kpi-diff.down{color:var(--rose);}

  .card{background:#fff;border-radius:14px;padding:20px;border:1.5px solid var(--slate-100);box-shadow:0 4px 20px rgba(0,0,0,.04);}
  .card h2{font-size:15px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

  .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .day-cell{aspect-ratio:1;padding:5px 6px;border:1.5px solid var(--slate-100);border-radius:7px;font-size:11px;display:flex;flex-direction:column;justify-content:space-between;}
  .day-cell.worked{background:var(--indigo-l);border-color:var(--indigo);}
  .day-cell.absent{background:#FEE2E2;border-color:var(--rose);}
  .day-cell.off{background:var(--slate-50);color:var(--slate-500);}
  .day-cell .d{font-weight:800;font-size:12px;}
  .day-cell .h{font-size:9px;color:var(--slate-500);font-weight:700;}
  .day-cell.worked .h{color:var(--indigo);}

  .row-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:680px){.row-stats{grid-template-columns:1fr;}}
  .stat-line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--slate-100);font-size:12px;}
  .stat-line:last-child{border-bottom:none;}
  .stat-line .l{color:var(--slate-500);font-weight:600;}
  .stat-line .v{font-weight:800;color:var(--slate-900);}

  .eval-bar{display:flex;align-items:center;gap:8px;}
  .eval-bar .name{width:100px;font-size:11px;font-weight:700;color:var(--slate-700);}
  .eval-bar .bar{flex:1;height:8px;background:var(--slate-100);border-radius:4px;overflow:hidden;}
  .eval-bar .fill{height:100%;background:linear-gradient(90deg,var(--indigo),var(--purple));border-radius:4px;}
  .eval-bar .v{font-size:12px;font-weight:800;color:var(--indigo);width:36px;text-align:right;}

  .btn{padding:9px 14px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;border:none;}
  .btn-primary{background:#DC2626;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25);}
  .btn-ghost{background:var(--slate-100);color:var(--slate-700);}

  .empty{text-align:center;padding:60px 20px;color:var(--slate-500);font-size:13px;}
  .empty .ic{font-size:42px;display:block;margin-bottom:8px;}

  @media print{
    .nav, .controls, .staff-list, .btn{display:none !important;}
    .layout{grid-template-columns:1fr;}
    .page-header h1{font-size:16px;}
    .card, .kpi{box-shadow:none;border:1px solid #ccc;}
    @page{size:A4 portrait;margin:10mm;}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/" class="logo"><span class="logo-mark">R</span><span>RAKURAKU 月次サマリ</span></a>
    <div style="display:flex;gap:10px;">
      <a href="/shift.html" style="font-size:12px;color:var(--slate-500);font-weight:700;align-self:center;">← シフト画面</a>
      <button class="btn btn-ghost" onclick="window.print()" style="font-size:11px;">🖨 印刷</button>
    </div>
  </div>
</header>

<div class="container">

<div class="page-header">
  <div>
    <h1>📈 スタッフ別 月次サマリ</h1>
    <p class="sub">スタッフごとの勤務時間・給与・出勤率・評価を月単位で確認</p>
  </div>
  <div class="controls">
    <select id="month-sel">
      <!-- JS で生成 -->
    </select>
    <button class="btn btn-primary" onclick="loadData()">🔄 更新</button>
  </div>
</div>

<div class="layout">

  <!-- 左: スタッフ一覧 -->
  <aside class="staff-list">
    <h3>👥 スタッフを選択</h3>
    <div id="staff-list-body">
      <div class="empty" style="padding:24px 12px;font-size:11px;">
        <span class="ic" style="font-size:30px;">👤</span>
        スタッフを読み込み中...
      </div>
    </div>
  </aside>

  <!-- 右: 月次サマリ -->
  <div class="main-content" id="main-content">
    <div class="empty">
      <span class="ic">👈</span>
      左からスタッフを選択してください
    </div>
  </div>

</div>

</div>

<script>
// ====== データロード ======
function loadShiftData() {
  try { return JSON.parse(localStorage.getItem('rakuraku-shift-data') || '{}'); }
  catch(e) { return {}; }
}
function loadStaffData() {
  const d = loadShiftData();
  return (d.staffs || d.staff || []).filter(s => s && (s.name || s.id));
}
function loadShifts() {
  const d = loadShiftData();
  return d.generatedShifts || d.shifts || [];
}
function loadAttendance() {
  try { return JSON.parse(localStorage.getItem('rakuraku-attendance') || '[]'); }
  catch(e) { return []; }
}
function loadEvaluations(staffId) {
  try {
    const all = JSON.parse(localStorage.getItem('rakuraku-evaluations') || '{}');
    return all[staffId] || {};
  } catch(e) { return {}; }
}

// ====== 月セレクタ ======
function initMonthSelector() {
  const sel = document.getElementById('month-sel');
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const opt = document.createElement('option');
    opt.value = `${y}-${String(m).padStart(2,'0')}`;
    opt.textContent = `${y}年 ${m}月`;
    sel.appendChild(opt);
  }
}

// ====== スタッフ一覧 ======
let currentStaffId = null;
function renderStaffList() {
  const staffs = loadStaffData();
  const body = document.getElementById('staff-list-body');
  if (!staffs.length) {
    body.innerHTML = `<div class="empty" style="padding:24px 12px;font-size:11px;">
      <span class="ic" style="font-size:30px;">📋</span>スタッフ未登録</div>`;
    return;
  }
  body.innerHTML = '';
  staffs.forEach(s => {
    const id = s.id || s.name;
    const item = document.createElement('div');
    item.className = 'staff-item' + (id === currentStaffId ? ' active' : '');
    const monthHrs = calcMonthHours(s);
    item.innerHTML = `<span>${escapeHtml(s.name || id)}</span><span class="badge">${monthHrs}h</span>`;
    item.onclick = () => selectStaff(id);
    body.appendChild(item);
  });
}

function calcMonthHours(staff) {
  const month = document.getElementById('month-sel').value;
  if (!month) return 0;
  const shifts = loadShifts();
  let total = 0;
  shifts.forEach(sh => {
    if (!sh.date || !sh.date.startsWith(month)) return;
    (sh.assignments || []).forEach(a => {
      if ((a.staffId === staff.id || a.staffName === staff.name) && a.start && a.end) {
        total += calcHours(a.start, a.end);
      }
    });
  });
  return Math.round(total * 10) / 10;
}

function calcHours(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}

function selectStaff(id) {
  currentStaffId = id;
  renderStaffList();
  renderSummary(id);
}

// ====== 月次サマリ描画 ======
function renderSummary(staffId) {
  const staff = loadStaffData().find(s => (s.id || s.name) === staffId);
  if (!staff) return;
  const month = document.getElementById('month-sel').value;
  const root = document.getElementById('main-content');

  const shifts = loadShifts();
  const attendance = loadAttendance();
  const monthShifts = shifts.filter(s => s.date && s.date.startsWith(month));

  // 集計
  let totalHrs = 0, nightHrs = 0, workDays = 0, absentDays = 0;
  let wage = staff.wage || 1200;
  let earnings = 0, nightEarnings = 0;

  const daySet = new Set();
  monthShifts.forEach(sh => {
    (sh.assignments || []).forEach(a => {
      if (a.staffId === staff.id || a.staffName === staff.name) {
        const hrs = calcHours(a.start, a.end);
        totalHrs += hrs;
        // 深夜計算（22:00以降）
        const nightHr = calcNightHours(a.start, a.end);
        nightHrs += nightHr;
        const normalHr = hrs - nightHr;
        earnings += normalHr * wage;
        nightEarnings += nightHr * wage * 1.25;
        daySet.add(sh.date);
      }
    });
  });
  workDays = daySet.size;

  attendance.forEach(at => {
    if ((at.staffId === staff.id || at.staffName === staff.name) && at.date && at.date.startsWith(month)) {
      if (at.absent) absentDays++;
    }
  });

  const totalEarnings = Math.round(earnings + nightEarnings);
  const attendRate = workDays + absentDays > 0 ? Math.round(workDays / (workDays + absentDays) * 100) : 100;

  // 評価
  const evals = loadEvaluations(staffId);
  const evalKeys = ['hall', 'kitchen', 'cashier', 'leadership', 'punctuality'];
  const evalNames = { hall:'ホール', kitchen:'キッチン', cashier:'レジ', leadership:'リーダーシップ', punctuality:'時間厳守' };

  // カレンダー
  const [yr, mo] = month.split('-').map(Number);
  const firstDay = new Date(yr, mo - 1, 1);
  const lastDay = new Date(yr, mo, 0);
  const startOffset = firstDay.getDay();
  let calHtml = '<div class="calendar">';
  ['日','月','火','水','木','金','土'].forEach(d => {
    calHtml += `<div style="font-size:10px;font-weight:800;color:var(--slate-500);text-align:center;padding:3px 0;">${d}</div>`;
  });
  for (let i = 0; i < startOffset; i++) calHtml += `<div></div>`;
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dateStr = `${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const sh = monthShifts.find(s => s.date === dateStr);
    let hrs = 0, status = 'off';
    if (sh) {
      (sh.assignments || []).forEach(a => {
        if (a.staffId === staff.id || a.staffName === staff.name) {
          hrs += calcHours(a.start, a.end);
          status = 'worked';
        }
      });
    }
    const ab = attendance.find(at => at.date === dateStr && at.absent && (at.staffId === staff.id || at.staffName === staff.name));
    if (ab) status = 'absent';
    calHtml += `<div class="day-cell ${status}"><div class="d">${d}</div><div class="h">${hrs > 0 ? hrs.toFixed(1) + 'h' : status === 'absent' ? '欠勤' : ''}</div></div>`;
  }
  calHtml += '</div>';

  root.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2 style="font-size:20px;font-weight:900;margin:0;">${escapeHtml(staff.name)} さん</h2>
      <span style="font-size:12px;color:var(--slate-500);font-weight:700;">${yr}年 ${mo}月</span>
    </div>

    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-label">勤務時間</div>
        <div class="kpi-value">${totalHrs.toFixed(1)}<span class="unit">時間</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">出勤日数</div>
        <div class="kpi-value">${workDays}<span class="unit">日</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">深夜時間</div>
        <div class="kpi-value">${nightHrs.toFixed(1)}<span class="unit">時間</span></div>
      </div>
      <div class="kpi">
        <div class="kpi-label">予想給与</div>
        <div class="kpi-value">¥${totalEarnings.toLocaleString()}</div>
      </div>
    </div>

    <div class="card">
      <h2>📅 月間勤務カレンダー</h2>
      ${calHtml}
      <div style="display:flex;gap:14px;margin-top:12px;font-size:11px;color:var(--slate-500);">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--indigo-l);border-radius:2px;vertical-align:middle;"></span> 出勤</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#FEE2E2;border-radius:2px;vertical-align:middle;"></span> 欠勤</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--slate-50);border:1px solid var(--slate-200);border-radius:2px;vertical-align:middle;"></span> 休み</span>
      </div>
    </div>

    <div class="row-stats">
      <div class="card">
        <h2>💰 給与内訳</h2>
        <div class="stat-line"><span class="l">時給</span><span class="v">¥${wage.toLocaleString()}</span></div>
        <div class="stat-line"><span class="l">通常勤務</span><span class="v">¥${Math.round(earnings).toLocaleString()}</span></div>
        <div class="stat-line"><span class="l">深夜割増 (+25%)</span><span class="v">¥${Math.round(nightEarnings).toLocaleString()}</span></div>
        <div class="stat-line" style="border-top:2px solid var(--slate-200);padding-top:12px;margin-top:6px;border-bottom:none;">
          <span class="l" style="font-weight:800;color:var(--slate-900);">合計</span>
          <span class="v" style="font-size:16px;color:var(--indigo);">¥${totalEarnings.toLocaleString()}</span>
        </div>
      </div>
      <div class="card">
        <h2>📊 勤務指標</h2>
        <div class="stat-line"><span class="l">出勤率</span><span class="v" style="color:${attendRate >= 95 ? 'var(--emerald)' : attendRate >= 80 ? 'var(--amber)' : 'var(--rose)'};">${attendRate}%</span></div>
        <div class="stat-line"><span class="l">欠勤日数</span><span class="v">${absentDays}日</span></div>
        <div class="stat-line"><span class="l">平均勤務時間/日</span><span class="v">${workDays > 0 ? (totalHrs/workDays).toFixed(1) : '0'}時間</span></div>
        <div class="stat-line" style="border-bottom:none;"><span class="l">深夜比率</span><span class="v">${totalHrs > 0 ? Math.round(nightHrs/totalHrs*100) : 0}%</span></div>
      </div>
    </div>

    <div class="card">
      <h2>⭐ スタッフ評価（5段階）</h2>
      ${evalKeys.map(k => {
        const v = evals[k] || 0;
        return `<div class="eval-bar" style="margin-bottom:7px;">
          <div class="name">${evalNames[k]}</div>
          <div class="bar"><div class="fill" style="width:${v * 20}%;"></div></div>
          <div class="v">${v.toFixed(1)} / 5</div>
        </div>`;
      }).join('')}
      <p style="font-size:10px;color:var(--slate-500);margin-top:10px;">※ シフト画面のスタッフ名タップから評価を更新できます</p>
    </div>

    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="window.open('/payroll.html?staff=' + encodeURIComponent('${staff.name}') + '&month=${month}', '_blank')">💴 給与明細PDFを開く</button>
      <button class="btn btn-ghost" onclick="window.print()">🖨 このページを印刷</button>
    </div>
  `;
}

// ====== 深夜時間計算 ======
function calcNightHours(start, end) {
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let s = sh * 60 + sm;
  let e = eh * 60 + em;
  if (e <= s) e += 24 * 60;
  // 22:00 = 22*60, 5:00 翌 = 29*60
  const nightStart = 22 * 60;
  const nightEnd = 29 * 60;
  let overlap = 0;
  // 同日内 22:00-24:00
  const ovS = Math.max(s, nightStart);
  const ovE = Math.min(e, nightEnd);
  if (ovE > ovS) overlap = ovE - ovS;
  return overlap / 60;
}

// ====== ユーティリティ ======
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function loadData() {
  renderStaffList();
  if (currentStaffId) renderSummary(currentStaffId);
}

document.addEventListener('DOMContentLoaded', () => {
  initMonthSelector();
  renderStaffList();
});
</script>
</body>
</html>
