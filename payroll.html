<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>給与明細 — RAKURAKU</title>
<meta name="description" content="スタッフ向け給与明細表示。パスワード保護で個人給与のみ確認可能"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#DC2626">
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--indigo:#4F46E5;--purple:#7C3AED;--emerald:#10B981;--red:#EF4444;--amber:#F59E0B;
        --slate-900:#0F172A;--slate-700:#334155;--slate-500:#64748B;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--slate-50:#F8FAFC;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  @page{size:A4 portrait;margin:0;}
  @media print{html,body{margin:0;background:#fff;}.toolbar{display:none !important;}.page{box-shadow:none !important;margin:0 !important;page-break-after:always;}.page:last-child{page-break-after:auto;}}
  html,body{font-family:'Noto Sans JP','Inter',sans-serif;color:var(--slate-900);background:#E5E7EB;line-height:1.5;}
  .toolbar{position:sticky;top:0;z-index:100;background:#0F172A;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .toolbar h1{font-size:14px;font-weight:800;}
  .toolbar select, .toolbar input{padding:6px 10px;border:none;border-radius:6px;font-size:12px;font-family:inherit;}
  .toolbar button{padding:7px 16px;background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:800;font-size:12px;}
  .toolbar .hint{margin-left:auto;color:#94A3B8;font-size:11px;}
  .page{width:210mm;min-height:297mm;background:#fff;margin:20px auto;padding:18mm 16mm;box-shadow:0 8px 32px rgba(0,0,0,.15);position:relative;page-break-after:always;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--indigo);padding-bottom:10mm;margin-bottom:8mm;}
  .h-title{font-size:24px;font-weight:900;letter-spacing:-.02em;}
  .h-sub{font-size:11px;color:var(--slate-500);font-weight:700;margin-top:2mm;}
  .h-period{font-size:14px;font-weight:900;color:var(--indigo);}
  .h-meta{font-size:10px;color:var(--slate-500);margin-top:1mm;font-weight:600;}
  .staff-block{margin-bottom:14mm;break-inside:avoid;}
  .staff-name{font-size:18px;font-weight:900;letter-spacing:-.01em;margin-bottom:3mm;border-left:5px solid var(--indigo);padding-left:6mm;}
  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-bottom:5mm;}
  .stat{background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;border-radius:8px;padding:4mm;text-align:center;}
  .stat-lbl{font-size:9px;font-weight:800;opacity:.9;letter-spacing:.04em;}
  .stat-val{font-size:18px;font-weight:900;margin-top:1mm;letter-spacing:-.01em;}
  .stat-sub{font-size:8.5px;opacity:.8;margin-top:1px;font-weight:600;}
  .detail-tbl{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:3mm;}
  .detail-tbl th, .detail-tbl td{padding:5px 8px;border-bottom:1px solid var(--slate-100);text-align:right;}
  .detail-tbl th{background:var(--slate-50);font-weight:800;font-size:10px;text-align:center;}
  .detail-tbl td:first-child, .detail-tbl th:first-child{text-align:left;font-weight:700;color:var(--slate-700);}
  .detail-tbl .tot-row{background:linear-gradient(135deg,#FAF5FF,var(--indigo-l));font-weight:900;color:var(--indigo);}
  .pay-total{font-size:24px;font-weight:900;color:var(--indigo);text-align:right;margin-top:5mm;padding-top:4mm;border-top:2px solid var(--indigo);}
  .pay-total .yen{font-size:14px;vertical-align:top;margin-right:2px;}
  .pay-total small{font-size:11px;color:var(--slate-500);font-weight:700;margin-left:8px;}
  .footer-note{position:absolute;bottom:10mm;left:16mm;right:16mm;font-size:9px;color:var(--slate-500);text-align:center;border-top:1px solid var(--slate-100);padding-top:4mm;font-weight:600;}
  .empty{text-align:center;color:var(--slate-500);font-size:14px;padding:30mm 0;font-weight:600;}
</style>
</head>
<body>

<div class="toolbar">
  <h1>💴 給与明細</h1>
  <label>店舗ID: <input id="shop-input" placeholder="bar-exchange" /></label>
  <label>月: <input id="month-input" type="month" /></label>
  <button onclick="loadAndRender()">🔄 読込</button>
  <button onclick="window.print()">🖨️ 印刷 / PDF保存</button>
  <button onclick="exportCSV('freee')" style="background:linear-gradient(135deg,#F97316,#EA580C);">📤 freee CSV</button>
  <button onclick="exportCSV('mf')" style="background:linear-gradient(135deg,#10B981,#059669);">📤 マネフォ CSV</button>
  <button onclick="exportCSV('generic')" style="background:#475569;">📤 汎用CSV</button>
  <span class="hint">余白「なし」+ カラー印刷 推奨</span>
</div>

<div id="pages-container">
  <div class="page">
    <div class="empty">📋 店舗ID と 月を入力して「読込」してください</div>
  </div>
</div>

<script src="/i18n.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  document.getElementById('shop-input').value = params.get('shop') || '';
  const ymNow = new Date().toISOString().slice(0,7);
  document.getElementById('month-input').value = params.get('month') || ymNow;
  if (params.get('shop')) loadAndRender();

  async function loadAndRender() {
    const shopId = document.getElementById('shop-input').value.trim();
    const ym     = document.getElementById('month-input').value;
    if (!shopId || !ym) return;
    history.replaceState(null, '', `?shop=${encodeURIComponent(shopId)}&month=${ym}`);

    /* 出退勤データ + 店舗メタ取得 */
    let attendance = [], meta = { shopName: shopId };
    try {
      const [aRes, mRes] = await Promise.all([
        fetch(`/api/attendance/month?shop=${encodeURIComponent(shopId)}&month=${ym}`),
        fetch(`/api/shop/${encodeURIComponent(shopId)}/meta`),
      ]);
      if (aRes.ok) attendance = await aRes.json();
      if (mRes.ok) meta = await mRes.json();
    } catch(e) {}

    /* スタッフ別集計 */
    const byStaff = {};
    attendance.forEach(r => {
      if (!byStaff[r.name]) byStaff[r.name] = [];
      byStaff[r.name].push(r);
    });

    if (!Object.keys(byStaff).length) {
      document.getElementById('pages-container').innerHTML =
        '<div class="page"><div class="empty">📭 この期間の打刻データがありません</div></div>';
      return;
    }

    /* 設定（時給・深夜割増・交通費）— 店舗の job_template から取得試行 */
    let hourly = 1200, nightExtra = 0.25, dailyTransport = 0;
    try {
      const snap = await fetch(`/api/shop/${encodeURIComponent(shopId)}/snapshot`).then(r => r.ok ? r.json() : {});
      const tpl = snap.job_template ? JSON.parse(snap.job_template) : null;
      if (tpl && tpl.defaultWageNormal) hourly = parseInt(tpl.defaultWageNormal) || 1200;
    } catch(e) {}

    const html = Object.entries(byStaff).map(([name, records]) => {
      const calc = calcWorkdays(records, hourly, nightExtra, dailyTransport);
      return renderStaffBlock(name, calc, ym, meta);
    }).join('');
    document.getElementById('pages-container').innerHTML = html;
  }

  function calcWorkdays(records, hourly, nightExtra, dailyTransport) {
    /* 日付ごとに in/out/break をペアリング */
    const byDay = {};
    records.sort((a,b) => a.ts - b.ts).forEach(r => {
      const dayKey = new Date(r.ts).toISOString().slice(0,10);
      if (!byDay[dayKey]) byDay[dayKey] = [];
      byDay[dayKey].push(r);
    });
    const days = [];
    let totalMinNormal = 0, totalMinNight = 0, totalBreak = 0;
    Object.entries(byDay).forEach(([day, recs]) => {
      let inT = null, breakT = null, workMs = 0, breakMs = 0, nightMs = 0;
      recs.forEach(r => {
        if (r.type === 'in') inT = r.ts;
        else if (r.type === 'out' && inT) {
          const seg = r.ts - inT;
          workMs += seg;
          nightMs += calcNightMs(inT, r.ts);
          inT = null;
        }
        else if (r.type === 'break_start' && inT) {
          const seg = r.ts - inT;
          workMs += seg;
          nightMs += calcNightMs(inT, r.ts);
          breakT = r.ts;
          inT = null;
        }
        else if (r.type === 'break_end' && breakT) {
          breakMs += r.ts - breakT;
          inT = r.ts;
          breakT = null;
        }
      });
      const totalMin = Math.floor(workMs/60000);
      const nightMin = Math.floor(nightMs/60000);
      const normalMin = totalMin - nightMin;
      const brkMin = Math.floor(breakMs/60000);
      days.push({ day, totalMin, normalMin, nightMin, brkMin });
      totalMinNormal += normalMin;
      totalMinNight += nightMin;
      totalBreak += brkMin;
    });
    const wageNormal = Math.round((totalMinNormal/60) * hourly);
    const wageNight  = Math.round((totalMinNight /60) * hourly * (1 + nightExtra));
    const transport  = dailyTransport * days.length;
    const total      = wageNormal + wageNight + transport;
    return { days, totalMinNormal, totalMinNight, totalBreak, hourly, nightExtra, wageNormal, wageNight, transport, total };
  }

  function calcNightMs(startTs, endTs) {
    /* 22:00-翌5:00 の重なり時間を計算 */
    let total = 0;
    const oneDay = 86400000;
    let cur = startTs;
    while (cur < endTs) {
      const d = new Date(cur);
      const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      const night22 = dayStart + 22 * 3600 * 1000;
      const night5n = dayStart + 29 * 3600 * 1000; // 翌5時
      const segEnd = Math.min(endTs, dayStart + oneDay);
      const o1 = Math.max(cur, night22);
      const o2 = Math.min(segEnd, night5n);
      if (o2 > o1) total += (o2 - o1);
      /* 0-5時部分も計算 */
      const earlyEnd = dayStart + 5 * 3600 * 1000;
      const e1 = Math.max(cur, dayStart);
      const e2 = Math.min(segEnd, earlyEnd);
      if (e2 > e1) total += (e2 - e1);
      cur = segEnd;
    }
    return total;
  }

  function renderStaffBlock(name, c, ym, meta) {
    const fmt = (n) => '¥' + n.toLocaleString();
    const min2hm = (m) => Math.floor(m/60) + '時間' + (m%60) + '分';
    const [y, mo] = ym.split('-');
    const daysHtml = c.days.map(d => {
      const dt = new Date(d.day);
      return `<tr>
        <td>${dt.getMonth()+1}/${dt.getDate()}(${['日','月','火','水','木','金','土'][dt.getDay()]})</td>
        <td>${min2hm(d.normalMin)}</td>
        <td>${min2hm(d.nightMin)}</td>
        <td>${min2hm(d.brkMin)}</td>
        <td>${min2hm(d.totalMin)}</td>
      </tr>`;
    }).join('');
    return `
      <div class="page">
        <div class="header">
          <div>
            <div class="h-title">${escape(name)} 様 給与明細</div>
            <div class="h-sub">${escape(meta.shopName || meta.name || '')} ${escape(meta.address || '')}</div>
          </div>
          <div style="text-align:right;">
            <div class="h-period">${y}年${parseInt(mo)}月分</div>
            <div class="h-meta">発行日: ${new Date().toISOString().slice(0,10)}</div>
          </div>
        </div>
        <div class="staff-block">
          <div class="summary-grid">
            <div class="stat"><div class="stat-lbl">勤務日数</div><div class="stat-val">${c.days.length}<small style="font-size:10px;"> 日</small></div></div>
            <div class="stat"><div class="stat-lbl">通常時間</div><div class="stat-val">${min2hm(c.totalMinNormal)}</div></div>
            <div class="stat" style="background:linear-gradient(135deg,#F59E0B,#D97706);"><div class="stat-lbl">深夜時間 +25%</div><div class="stat-val">${min2hm(c.totalMinNight)}</div></div>
            <div class="stat" style="background:linear-gradient(135deg,#10B981,#059669);"><div class="stat-lbl">休憩時間 (控除)</div><div class="stat-val">${min2hm(c.totalBreak)}</div></div>
          </div>
          <table class="detail-tbl">
            <thead>
              <tr><th>日付</th><th>通常時間</th><th>深夜時間</th><th>休憩</th><th>合計</th></tr>
            </thead>
            <tbody>
              ${daysHtml}
              <tr class="tot-row"><td>月合計</td><td>${min2hm(c.totalMinNormal)}</td><td>${min2hm(c.totalMinNight)}</td><td>${min2hm(c.totalBreak)}</td><td>${min2hm(c.totalMinNormal + c.totalMinNight)}</td></tr>
            </tbody>
          </table>
          <table class="detail-tbl" style="margin-top:6mm;">
            <thead><tr><th>項目</th><th colspan="2">単価/時間</th><th>金額</th></tr></thead>
            <tbody>
              <tr><td>通常時給</td><td colspan="2">¥${c.hourly} × ${min2hm(c.totalMinNormal)}</td><td>${fmt(c.wageNormal)}</td></tr>
              <tr><td>深夜割増 (+25%)</td><td colspan="2">¥${Math.round(c.hourly*1.25)} × ${min2hm(c.totalMinNight)}</td><td>${fmt(c.wageNight)}</td></tr>
              <tr><td>交通費</td><td colspan="2">${c.days.length}日 × ¥${c.transport / Math.max(1,c.days.length) || 0}</td><td>${fmt(c.transport)}</td></tr>
            </tbody>
          </table>
          <div class="pay-total">
            <span class="yen">¥</span>${c.total.toLocaleString()}<small>支給合計（税引前）</small>
          </div>
        </div>
        <div class="footer-note">RAKURAKU シフト管理 自動生成 · ${escape(meta.shopName || '')} · 印刷後は経理ご担当へ</div>
      </div>
    `;
  }

  function escape(s) { return String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

  /* ════════ CSV エクスポート ════════
     freee:       https://support.freee.co.jp/hc/ja/articles/202850350  従業員別の給与CSV
     マネーフォワード: https://biz.moneyforward.com/payroll/    勤怠CSV import
     汎用:        Excel/カスタム用 */
  let _lastPayroll = []; /* { name, calc, ym } */

  /* loadAndRender の最後に _lastPayroll を保存するパッチ */
  const _origLoadAndRender = loadAndRender;
  loadAndRender = async function() {
    await _origLoadAndRender();
    /* 計算済みデータを別途保存 */
    const shopId = document.getElementById('shop-input').value.trim();
    const ym = document.getElementById('month-input').value;
    try {
      const aRes = await fetch(`/api/attendance/month?shop=${encodeURIComponent(shopId)}&month=${ym}`);
      if (!aRes.ok) return;
      const attendance = await aRes.json();
      const byStaff = {};
      attendance.forEach(r => {
        if (!byStaff[r.name]) byStaff[r.name] = [];
        byStaff[r.name].push(r);
      });
      let hourly = 1200;
      try {
        const snap = await fetch(`/api/shop/${encodeURIComponent(shopId)}/snapshot`).then(r => r.ok ? r.json() : {});
        const tpl = snap.job_template ? JSON.parse(snap.job_template) : null;
        if (tpl && tpl.defaultWageNormal) hourly = parseInt(tpl.defaultWageNormal) || 1200;
      } catch(e) {}
      _lastPayroll = Object.entries(byStaff).map(([name, records]) => ({
        name, calc: calcWorkdays(records, hourly, 0.25, 0), ym
      }));
    } catch(e) { console.warn(e); }
  };

  function exportCSV(format) {
    if (!_lastPayroll.length) {
      alert('⚠ 先に「読込」してデータを表示してください');
      return;
    }
    const ym = document.getElementById('month-input').value;
    const shopId = document.getElementById('shop-input').value.trim();
    let csv = '', filename = '';

    if (format === 'freee') {
      /* freee 給与計算 ぺージで取込めるフォーマット */
      csv = '従業員番号,従業員名,勤務日数,通常勤務時間(分),深夜勤務時間(分),休憩時間(分),通常給与,深夜割増,交通費,支給合計\n';
      _lastPayroll.forEach((p, i) => {
        const c = p.calc;
        csv += `${1000+i},"${p.name.replace(/"/g,'""')}",${c.days.length},${c.totalMinNormal},${c.totalMinNight},${c.totalBreak},${c.wageNormal},${c.wageNight},${c.transport},${c.total}\n`;
      });
      filename = `freee-payroll-${shopId}-${ym}.csv`;
    } else if (format === 'mf') {
      /* マネーフォワード 給与: 従業員名・基本情報 + 勤怠サマリ */
      csv = '従業員名,基準月,出勤日数,労働時間(h),深夜労働時間(h),休憩時間(h),時給(円),通常賃金,深夜割増賃金,交通費,総支給額\n';
      _lastPayroll.forEach(p => {
        const c = p.calc;
        csv += `"${p.name.replace(/"/g,'""')}",${ym},${c.days.length},${(c.totalMinNormal/60).toFixed(2)},${(c.totalMinNight/60).toFixed(2)},${(c.totalBreak/60).toFixed(2)},${c.hourly},${c.wageNormal},${c.wageNight},${c.transport},${c.total}\n`;
      });
      filename = `mf-payroll-${shopId}-${ym}.csv`;
    } else {
      /* 汎用 — Excel貼り付け用に全項目フラット */
      csv = '日付,従業員名,通常時間(分),深夜時間(分),休憩(分),合計(分),時給,日給(円)\n';
      _lastPayroll.forEach(p => {
        p.calc.days.forEach(d => {
          const dailyTotal = Math.round((d.normalMin/60) * p.calc.hourly + (d.nightMin/60) * p.calc.hourly * 1.25);
          csv += `${d.day},"${p.name.replace(/"/g,'""')}",${d.normalMin},${d.nightMin},${d.brkMin},${d.totalMin},${p.calc.hourly},${dailyTotal}\n`;
        });
      });
      filename = `payroll-detail-${shopId}-${ym}.csv`;
    }

    /* BOM 付きで Excel に対応 */
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
