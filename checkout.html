<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>お会計 — BAR EXCHANGE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --green:#00ff88; --red:#ff3355; --gold:#ffd700; --purple:#aa66ff;
    --bg:#060608; --card:#0d0f14; --card2:#111420;
    --border:#1a2030; --text:#e8eaf0; --muted:#4a5270;
    --mono:'JetBrains Mono',monospace; --sans:'Inter',sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:0 0 40px;
  }

  /* ── HEADER ── */
  #hdr{
    width:100%; background:#0a0c10; border-bottom:1px solid var(--border);
    padding:14px 20px; display:flex; align-items:center; justify-content:space-between;
  }
  .logo{ font-family:var(--mono); font-size:0.88rem; font-weight:700; color:var(--green); letter-spacing:3px; }
  .hdr-badge{
    font-size:0.6rem; padding:3px 10px; border-radius:4px; letter-spacing:2px;
    background:#aa66ff18; color:var(--purple); border:1px solid #aa66ff30;
  }

  /* ── CARD ── */
  .card{
    width:min(420px,100vw); margin-top:0; padding:0;
  }

  /* ── TABLE HERO ── */
  #table-hero{
    background:linear-gradient(160deg,#0a1520,#060a10);
    border-bottom:1px solid var(--border);
    padding:28px 24px 20px; text-align:center; width:100%;
  }
  .th-label{ font-size:0.62rem; letter-spacing:4px; color:var(--muted); margin-bottom:8px; }
  .th-num{
    font-family:var(--mono); font-size:3rem; font-weight:700;
    color:var(--text); line-height:1;
  }
  .th-sub{ font-size:0.72rem; color:var(--muted); margin-top:4px; }

  /* ── ORDER LIST ── */
  #order-section{ width:min(420px,100vw); padding:16px 16px 0; }
  .section-title{
    font-size:0.58rem; letter-spacing:3px; color:var(--muted);
    padding-bottom:10px; border-bottom:1px solid var(--border); margin-bottom:10px;
  }

  .order-row{
    display:flex; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px solid #0d1020;
  }
  .or-emoji{ font-size:1.4rem; flex-shrink:0; }
  .or-name{ flex:1; font-size:0.85rem; font-weight:600; }
  .or-time{ font-size:0.6rem; color:var(--muted); font-family:var(--mono); }
  .or-price{ font-family:var(--mono); font-size:0.9rem; font-weight:700; color:var(--green); flex-shrink:0; }

  /* ── TOTAL ── */
  #total-section{
    width:min(420px,100vw); padding:16px;
    background:var(--card); border-top:1px solid var(--border);
    border-bottom:1px solid var(--border); margin-top:4px;
  }
  .total-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .total-label{ font-size:0.62rem; color:var(--muted); letter-spacing:2px; }
  #total-amount{
    font-family:var(--mono); font-size:2rem; font-weight:700; color:var(--green);
  }
  .total-sub{ font-size:0.58rem; color:var(--muted); margin-top:4px; }

  /* ── PAY BUTTON ── */
  #pay-section{ width:min(420px,100vw); padding:16px; }

  #pay-btn{
    width:100%; padding:18px; border-radius:16px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#635bff,#4f46e5);
    color:#fff; font-size:1rem; font-weight:700; letter-spacing:1px;
    font-family:var(--sans); transition:all .2s;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 4px 30px #635bff40;
  }
  #pay-btn:active{ transform:scale(0.97); }
  #pay-btn:disabled{
    background:#1a2030; color:var(--muted); cursor:not-allowed; box-shadow:none;
  }
  .pay-icon{ font-size:1.2rem; }
  .pay-secure{
    display:flex; align-items:center; justify-content:center; gap:5px;
    font-size:0.6rem; color:var(--muted); margin-top:10px;
  }

  /* ── STATE SCREENS ── */
  .state-screen{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 24px; text-align:center; width:min(420px,100vw); flex:1;
  }
  .state-screen.active{ display:flex; }
  .state-icon{ font-size:3rem; margin-bottom:16px; }
  .state-title{ font-size:1.1rem; font-weight:700; margin-bottom:8px; }
  .state-sub{ font-size:0.78rem; color:var(--muted); line-height:1.6; }

  /* ── CANCELLED ── */
  #cancelled-notice{
    display:none; width:min(420px,100vw); padding:14px 16px; margin-top:12px;
    background:#ff335510; border:1px solid #ff335530; border-radius:12px;
    font-size:0.75rem; color:var(--red); text-align:center;
  }

  /* ── STRIPE BADGE ── */
  .stripe-badge{
    font-size:0.6rem; color:var(--muted); opacity:0.6;
    margin-top:4px; text-align:center;
  }
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">BAR EXCHANGE</div>
  <span class="hdr-badge">お会計</span>
</div>

<!-- Loading state -->
<div class="state-screen active" id="state-loading">
  <div class="state-icon">⏳</div>
  <div class="state-title">読み込み中…</div>
</div>

<!-- Error state -->
<div class="state-screen" id="state-error">
  <div class="state-icon">❌</div>
  <div class="state-title">エラーが発生しました</div>
  <div class="state-sub" id="error-msg">もう一度QRコードを読み取ってください</div>
</div>

<!-- Already paid state -->
<div class="state-screen" id="state-paid">
  <div class="state-icon">✅</div>
  <div class="state-title">お支払い済みです</div>
  <div class="state-sub">このご注文はすでに決済が完了しています。<br>ありがとうございました！</div>
</div>

<!-- Main content (hidden until loaded) -->
<div id="main-content" style="display:none;width:100%;display:none">
  <div id="table-hero">
    <div class="th-label">TABLE</div>
    <div class="th-num" id="table-num">—</div>
    <div class="th-sub" id="order-meta">—</div>
  </div>

  <div id="cancelled-notice">⚠️ お支払いがキャンセルされました。もう一度お試しください。</div>

  <div id="order-section">
    <div class="section-title">注文内容</div>
    <div id="order-list"></div>
  </div>

  <div id="total-section">
    <div class="total-row">
      <span class="total-label">お会計合計</span>
      <span id="total-amount">¥0</span>
    </div>
    <div class="total-sub">税込</div>
  </div>

  <div id="pay-section">
    <button id="pay-btn" disabled>
      <span class="pay-icon">💳</span>
      <span>カードで支払う</span>
    </button>
    <div class="pay-secure">🔒 Stripe により安全に処理されます</div>
    <div class="stripe-badge">Powered by Stripe</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
const cancelled = params.get('cancelled') === '1';

function showState(id) {
  document.querySelectorAll('.state-screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  document.getElementById('main-content').style.display = 'none';
}

function showMain() {
  document.querySelectorAll('.state-screen').forEach(s => s.classList.remove('active'));
  document.getElementById('main-content').style.display = 'block';
}

async function load() {
  if (!sessionId) {
    document.getElementById('error-msg').textContent = 'QRコードが無効です。スタッフにお申し付けください。';
    showState('state-error');
    return;
  }

  try {
    const res = await fetch(`/api/checkout/info/${sessionId}`);
    if (!res.ok) throw new Error('Session not found');
    const data = await res.json();

    if (data.status === 'paid') {
      showState('state-paid');
      return;
    }

    // Populate UI
    document.getElementById('table-num').textContent = data.tableNo + '番';
    document.getElementById('order-meta').textContent =
      `${data.orders.length}点 · 合計 ¥${data.total.toLocaleString()}`;

    const listEl = document.getElementById('order-list');
    listEl.innerHTML = data.orders.map(o => `
      <div class="order-row">
        <div class="or-emoji">${o.emoji || '🍹'}</div>
        <div>
          <div class="or-name">${o.drinkName || o.drinkId}</div>
          <div class="or-time">${o.time || ''}</div>
        </div>
        <div class="or-price">¥${o.price.toLocaleString()}</div>
      </div>
    `).join('');

    document.getElementById('total-amount').textContent = '¥' + data.total.toLocaleString();

    const payBtn = document.getElementById('pay-btn');
    payBtn.disabled = false;
    payBtn.onclick = () => {
      payBtn.disabled = true;
      payBtn.innerHTML = '<span>処理中…</span>';
      location.href = data.stripeUrl;
    };

    if (cancelled) {
      document.getElementById('cancelled-notice').style.display = 'block';
    }

    showMain();
  } catch (e) {
    document.getElementById('error-msg').textContent = 'セッションが見つかりません。スタッフにお申し付けください。';
    showState('state-error');
  }
}

load();
</script>
</body>
</html>
