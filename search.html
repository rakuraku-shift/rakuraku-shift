function search(q){
  const container = document.getElementById('results-container');
  if (!q || q.length < 1) {
    container.innerHTML = '<p style="color:#666;text-align:center">キーワードを入力すると結果が表示されます</p>';
    return;
  }
  const ql = q.toLowerCase();
  const results = INDEX.filter(item =>
    item.title.toLowerCase().includes(ql) ||
    item.desc.toLowerCase().includes(ql) ||
    item.tags.some(t => t.toLowerCase().includes(ql))
  );
  if (results.length === 0) {
    container.innerHTML = '<div class="no-results"><p>「' + escape(q) + '」に一致する結果が見つかりませんでした</p><p style="margin-top:10px;font-size:.9em">別のキーワードでお試しください</p></div>';
    return;
  }
  container.innerHTML = '<h2 style="color:#4F46E5;margin-bottom:15px">' + results.length + ' 件の結果</h2>' + results.map(r =>
    '<div class="result"><h3><a href="' + r.url + '">' + escape(r.title) + '</a></h3><div class="url">' + r.url + '</div><p>' + escape(r.desc) + '</p></div>'
  ).join('');
}

function escape(s){return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

// URL クエリパラメータから初期検索
(function(){
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if (q) {
    document.getElementById('q-input').value = q;
    search(q);
  }
})();
