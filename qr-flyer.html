<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR チラシ (トップページ × 12) — RAKURAKU</title>
<meta name="description" content="A4 印刷用 トップページ QR チラシ 12 枚 (営業ツール)">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--base:#0F172A;--accent:#4F46E5;--purple:#7C3AED;--gold:#FBBF24;--gray:#64748B}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:var(--base);background:#E5E7EB;padding:20px}
.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:10px;top:10px;background:var(--accent);color:#fff;padding:10px;z-index:9999}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* A4 1ページに 12 枚 (3列 x 4行) */
.a4{width:210mm;min-height:297mm;background:#fff;margin:0 auto;padding:4mm;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:2mm;height:289mm}
.card{border:1px dashed #94A3B8;border-radius:4px;padding:2mm 2mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#fff;page-break-inside:avoid;text-align:center;overflow:hidden}

.brand{margin-bottom:1mm}
.brand h1{font-size:11pt;font-weight:900;letter-spacing:-.3px;line-height:1}
.brand h1 .accent{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:6.5pt;color:var(--gray);font-weight:600;margin-top:0.5mm;line-height:1.2}

.qr-code{width:32mm;height:32mm;padding:1mm;background:#fff;border:1px solid #E2E8F0;border-radius:3px;margin:1mm 0}
.qr-code img,.qr-code canvas{width:100% !important;height:100% !important;display:block}

.url-text{font-size:6pt;color:var(--accent);font-weight:bold;font-family:Menlo,monospace;margin-top:1mm}

.benefits{font-size:6pt;line-height:1.4;color:var(--base);margin-top:1.5mm}
.benefits strong{color:#16A34A}

.footer-tel{font-size:6pt;color:var(--gray);margin-top:1mm;border-top:0.5px solid #E2E8F0;padding-top:1mm;width:100%;font-weight:600}

.controls{max-width:210mm;margin:0 auto 15px;text-align:center;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.controls button{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px;margin:0 5px}
.controls button:hover{background:#4338CA}
.controls .info{margin-top:8px;font-size:11px;color:var(--gray)}

@media print{
  html,body{margin:0 !important;padding:0 !important;background:#fff !important;width:210mm !important;height:297mm !important;overflow:hidden !important}
  .controls{display:none !important;visibility:hidden !important;height:0 !important;margin:0 !important;padding:0 !important}
  .a4{box-shadow:none !important;border:none !important;margin:0 !important;padding:4mm !important;width:210mm !important;height:297mm !important;min-height:297mm !important;max-height:297mm !important;page-break-after:avoid !important}
  .grid{height:289mm !important;page-break-inside:avoid !important}
  .card{break-inside:avoid !important;page-break-inside:avoid !important}
  @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>

<div class="controls">
  <button onclick="window.print()">🖨 印刷する (A4)</button>
  <button onclick="location.reload()">🔄 QR 再生成</button>
  <div class="info">A4 1 枚に <strong>12 枚の QR チラシ</strong> (3列×4行) / 1 枚 約 65×70mm / 切り取って 12 人に配布可</div>
</div>

<div class="a4" id="main">
  <div class="grid" id="card-grid">
    <!-- JSで 12 枚生成 -->
  </div>
</div>

<script>
const BASE_URL = 'https://rakuraku-shift-production.up.railway.app/';
const CARD_HTML = `
  <div class="brand">
    <h1>🏆 <span class="accent">RAKURAKU</span></h1>
    <div class="sub">飲食店向け<br>シフト管理 SaaS</div>
  </div>

  <div class="qr-code"></div>

  <div class="url-text">rakuraku-shift.com</div>

  <div class="benefits">
    🆓 <strong>個人店 永久無料</strong><br>
    🎁 30日 Pro 体験 (クレカ不要)
  </div>

  <div class="footer-tel">
    📞 080-5168-3303<br>
    代表 小泉 翔太
  </div>
`;

// 12 枚生成
const grid = document.getElementById('card-grid');
for (let i = 0; i < 12; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = CARD_HTML;
  grid.appendChild(card);

  // QR 生成
  new QRCode(card.querySelector('.qr-code'), {
    text: BASE_URL,
    width: 120,
    height: 120,
    colorDark: '#0F172A',
    colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.H
  });
}
</script>
</body>
</html>
