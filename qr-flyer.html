<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR チラシ (トップページ) — RAKURAKU</title>
<meta name="description" content="A4 印刷用 トップページ QR チラシ (営業ツール)">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<link rel="icon" href="/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--base:#0F172A;--accent:#4F46E5;--purple:#7C3AED;--gold:#FBBF24;--gray:#64748B}
body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:var(--base);background:#E5E7EB;padding:20px}
.skip-link{position:absolute;left:-9999px}.skip-link:focus{left:10px;top:10px;background:var(--accent);color:#fff;padding:10px;z-index:9999}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* A4 1ページに 6 枚 (2列 x 3行) でカット可能なチラシ */
.a4{width:210mm;min-height:297mm;background:#fff;margin:0 auto;padding:6mm;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;height:285mm}
.card{border:1.5px dashed #94A3B8;border-radius:8px;padding:6mm 5mm;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#fff,#FAFAFA);page-break-inside:avoid;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;background:radial-gradient(circle,rgba(79,70,229,.08),transparent);border-radius:50%}

.brand{text-align:center;margin-bottom:3mm}
.brand .tag{display:inline-block;background:var(--gold);color:var(--base);padding:1px 8px;border-radius:8px;font-size:7pt;font-weight:bold;margin-bottom:2mm}
.brand h1{font-size:15pt;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.brand h1 .accent{background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand .sub{font-size:8pt;color:var(--gray);font-weight:600;margin-top:1mm}

.qr-area{text-align:center;flex-grow:1;display:flex;flex-direction:column;justify-content:center;align-items:center;margin:2mm 0}
.qr-code{width:48mm;height:48mm;padding:2mm;background:#fff;border:1px solid #E2E8F0;border-radius:6px}
.qr-code img,.qr-code canvas{width:100% !important;height:100% !important;display:block}
.qr-label{font-size:8pt;font-weight:bold;color:var(--accent);margin-top:2mm;font-family:Menlo,monospace}
.scan-msg{font-size:7pt;color:var(--gray);margin-top:1mm}

.benefits{background:#F0FDF4;border-left:3px solid #22C55E;padding:2mm 3mm;border-radius:0 4px 4px 0;margin:2mm 0;font-size:7.5pt;line-height:1.5}
.benefits strong{color:#16A34A}

.footer-info{border-top:1.5px solid #E2E8F0;padding-top:2mm;text-align:center;font-size:7pt;color:var(--gray);line-height:1.5}
.footer-info strong{color:var(--base);font-size:8pt}
.footer-info .contact{display:flex;justify-content:space-around;margin-top:1mm}

.controls{max-width:210mm;margin:0 auto 15px;text-align:center;background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.controls button{background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:14px;margin:0 5px}
.controls button:hover{background:#4338CA}
.controls .info{margin-top:8px;font-size:11px;color:var(--gray)}

@media print{
  body{background:#fff;padding:0}
  .a4{box-shadow:none;margin:0;width:auto;min-height:auto}
  .controls{display:none}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>

<div class="controls">
  <button onclick="window.print()">🖨 印刷する (A4)</button>
  <button onclick="location.reload()">🔄 QR 再生成</button>
  <div class="info">A4 1 枚に <strong>同じ QR チラシを 6 枚</strong> (2列×3行) / 切り取って 6 人に配布可</div>
</div>

<div class="a4" id="main">
  <div class="grid" id="card-grid">
    <!-- JSで 6 枚生成 -->
  </div>
</div>

<script>
const BASE_URL = 'https://rakuraku-shift-production.up.railway.app/';
const CARD_HTML = `
  <div class="brand">
    <span class="tag">🏆 飲食店向けシフト管理 SaaS</span>
    <h1><span class="accent">RAKURAKU</span></h1>
    <p class="sub">バー・居酒屋・カフェの<br>シフト作成 5h → 1h</p>
  </div>

  <div class="qr-area">
    <div class="qr-code"></div>
    <div class="qr-label">rakuraku-shift.com</div>
    <div class="scan-msg">↑ スマホでスキャン</div>
  </div>

  <div class="benefits">
    🆓 <strong>個人店は永久無料</strong><br>
    🎁 30 日 Pro 体験 (クレカ不要)<br>
    ⚖️ 深夜手当 25% 自動計算<br>
    🌐 多言語 5 言語対応<br>
    📊 120 店舗超 / 継続率 97%
  </div>

  <div class="footer-info">
    <strong>株式会社 RAKURAKU</strong> / 代表 小泉 翔太<br>
    <div class="contact">
      <span>📞 080-5168-3303</span>
      <span>📧 koizumishota0323@gmail.com</span>
    </div>
  </div>
`;

// 6 枚生成
const grid = document.getElementById('card-grid');
for (let i = 0; i < 6; i++) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = CARD_HTML;
  grid.appendChild(card);

  // QR 生成
  new QRCode(card.querySelector('.qr-code'), {
    text: BASE_URL,
    width: 180,
    height: 180,
    colorDark: '#0F172A',
    colorLight: '#FFFFFF',
    correctLevel: QRCode.CorrectLevel.H
  });
}
</script>
</body>
</html>
