<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0" />
<title>マイシフト — RAKURAKU</title>
<meta name="description" content="自分の確定シフトを見る・休み変更届を出す・出退勤打刻"/>
<meta name="theme-color" content="#4F46E5">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#4F46E5; --purple:#7C3AED; --indigo-l:#EEF2FF;
    --emerald:#10B981; --emerald-l:#ECFDF5;
    --amber:#F59E0B; --amber-l:#FFFBEB;
    --red:#EF4444; --red-l:#FEF2F2;
    --blue:#3B82F6; --blue-l:#EFF6FF;
    --slate-900:#0F172A; --slate-700:#334155; --slate-500:#64748B; --slate-300:#CBD5E1; --slate-200:#E2E8F0; --slate-100:#F1F5F9; --slate-50:#F8FAFC;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{font-family:'Noto Sans JP','Inter',sans-serif;color:var(--slate-900);background:linear-gradient(180deg,var(--slate-50),#fff);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .header{background:linear-gradient(135deg,var(--indigo) 0%,var(--purple) 100%);color:#fff;padding:16px 18px;}
  .h-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .h-logo{width:30px;height:30px;background:#fff;color:var(--indigo);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;}
  .h-name{font-size:11px;color:rgba(255,255,255,.85);font-weight:700;letter-spacing:.04em;}
  .h-name strong{font-size:14px;color:#fff;display:block;letter-spacing:-.01em;}
  .h-title{font-size:22px;font-weight:900;letter-spacing:-.02em;}
  .h-sub{font-size:11px;color:rgba(255,255,255,.8);font-weight:600;margin-top:2px;}
  .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px;background:#fff;border-bottom:1px solid var(--slate-100);}
  .qa-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 10px;border:none;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;color:#fff;letter-spacing:.02em;}
  .qa-clock{background:linear-gradient(135deg,var(--emerald),#059669);}
  .qa-change{background:linear-gradient(135deg,var(--amber),#D97706);}
  .container{max-width:480px;margin:0 auto;padding:14px 16px 80px;}
  .name-card{background:#fff;border:1.5px solid var(--slate-100);border-radius:14px;padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .name-card label{font-size:11px;font-weight:800;color:var(--slate-500);letter-spacing:.06em;flex-shrink:0;}
  .name-card input{flex:1;padding:10px 12px;border:1.5px solid var(--slate-200);border-radius:8px;font-size:15px;font-weight:700;font-family:inherit;outline:none;}
  .name-card input:focus{border-color:var(--indigo);}
  .cal-card{background:#fff;border:1.5px solid var(--slate-100);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.04);}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav{width:32px;height:32px;border-radius:8px;background:var(--slate-50);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--slate-700);}
  .cal-month{font-size:15px;font-weight:900;letter-spacing:-.01em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-dow{text-align:center;font-size:10px;font-weight:800;color:var(--slate-500);padding:6px 0;letter-spacing:.04em;}
  .cal-dow.sun{color:var(--red);}
  .cal-dow.sat{color:var(--blue);}
  .cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-size:12px;font-weight:700;background:var(--slate-50);position:relative;color:var(--slate-700);transition:all .15s;cursor:pointer;}
  .cal-day:hover{background:var(--indigo-l);}
  .cal-day.empty{visibility:hidden;}
  .cal-day.past{opacity:.5;}
  .cal-day.today{outline:2px solid var(--indigo);}
  .cal-day.shift-confirmed{background:linear-gradient(135deg,var(--indigo-l),#FAF5FF);color:var(--indigo);font-weight:900;}
  .cal-day.shift-confirmed::after{content:'';position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--indigo);}
  .cal-day.shift-off{background:var(--slate-100);color:var(--slate-300);}
  .cal-day.absence-requested{background:linear-gradient(135deg,var(--amber-l),#FFFBEB);color:var(--amber);font-weight:900;}
  .cal-day.absence-requested::after{content:'休';position:absolute;bottom:2px;font-size:8px;color:var(--amber);}
  .cal-day.sun{color:var(--red);}
  .cal-day.sat{color:var(--blue);}
  .today-card{background:linear-gradient(135deg,var(--indigo) 0%,var(--purple) 100%);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;}
  .today-eyebrow{font-size:10px;font-weight:800;color:rgba(255,255,255,.7);letter-spacing:.08em;margin-bottom:4px;}
  .today-date{font-size:18px;font-weight:900;letter-spacing:-.01em;margin-bottom:8px;}
  .today-time{font-size:24px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .today-empty{font-size:14px;color:rgba(255,255,255,.85);font-weight:700;}
  .list-card{background:#fff;border:1.5px solid var(--slate-100);border-radius:14px;padding:16px;margin-bottom:14px;}
  .list-title{font-size:13px;font-weight:900;color:var(--slate-900);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .list-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--slate-100);font-size:12px;}
  .list-row:last-child{border-bottom:none;}
  .list-row .day{font-weight:800;color:var(--slate-900);}
  .list-row .time{color:var(--slate-700);font-weight:700;font-variant-numeric:tabular-nums;}
  .list-row .pos{font-size:10px;color:var(--indigo);background:var(--indigo-l);padding:2px 8px;border-radius:6px;font-weight:800;}
  .list-row .badge-cancel{font-size:10px;color:var(--amber);background:var(--amber-l);padding:2px 8px;border-radius:6px;font-weight:800;}
  .list-empty{text-align:center;color:var(--slate-500);font-size:12px;padding:14px 0;font-weight:600;}
  .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(6px);z-index:200;align-items:flex-end;justify-content:center;}
  .modal.show{display:flex;}
  .modal-card{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px 20px 28px;max-height:90vh;overflow-y:auto;animation:slideUp .25s cubic-bezier(.16,1,.3,1);}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:40px;height:4px;background:var(--slate-200);border-radius:4px;margin:0 auto 14px;}
  .modal-title{font-size:18px;font-weight:900;text-align:center;margin-bottom:6px;letter-spacing:-.01em;}
  .modal-sub{font-size:12px;color:var(--slate-500);text-align:center;margin-bottom:18px;font-weight:600;}
  .modal-field{margin-bottom:14px;}
  .modal-field label{display:block;font-size:11px;font-weight:800;color:var(--slate-700);margin-bottom:6px;letter-spacing:.04em;}
  .modal-field input, .modal-field select, .modal-field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--slate-200);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--slate-50);}
  .modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus{border-color:var(--indigo);background:#fff;}
  .modal-field textarea{resize:vertical;min-height:80px;line-height:1.6;}
  .modal-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:.02em;margin-top:6px;}
  .modal-btn.submit{background:linear-gradient(135deg,var(--amber),#D97706);color:#fff;box-shadow:0 6px 20px rgba(245,158,11,.3);}
  .modal-btn.cancel{background:var(--slate-100);color:var(--slate-700);margin-top:8px;}
  .modal-warn{background:var(--amber-l);border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;font-size:12px;color:#92400E;font-weight:700;line-height:1.6;margin-bottom:14px;}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .25s,transform .25s;z-index:300;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.success{background:linear-gradient(135deg,var(--emerald),#059669);}
  .toast.error{background:linear-gradient(135deg,var(--red),#DC2626);}
</style>
</head>
<body>
<div class="header">
  <div class="h-top">
    <div class="h-logo">R</div>
    <div class="h-name" style="flex:1;">My Shift · <strong id="shop-name" data-i18n="common.loading">読込中…</strong></div>
    <div id="lang-switcher"></div>
  </div>
  <div class="h-title" data-i18n="my.title">📅 私の確定シフト</div>
  <div class="h-sub" data-i18n="my.sub">確定したシフト・休み変更届・出退勤打刻</div>
</div>
<div class="quick-actions">
  <a href="#" class="qa-btn qa-clock" id="qa-clock-link" data-i18n="my.qa_clock">⏰ 出退勤打刻</a>
  <button class="qa-btn qa-change" onclick="openChangeModal()" data-i18n="my.qa_change">🆘 休み変更届</button>
</div>
<div class="container">
  <div class="name-card">
    <label data-i18n="common.name">👤 名前</label>
    <input type="text" id="staff-name" data-i18n-placeholder="att.name_ph" placeholder="山田 太郎" autocomplete="name" />
  </div>
  <div class="today-card" id="today-card">
    <div class="today-eyebrow" data-i18n="my.today_label">本日のシフト</div>
    <div class="today-date" id="today-date" data-i18n="common.loading">読込中…</div>
    <div class="today-time" id="today-time">--:-- 〜 --:--</div>
  </div>
  <div class="cal-card">
    <div class="cal-header">
      <button class="cal-nav" onclick="navMonth(-1)">‹</button>
      <div class="cal-month" id="cal-month">2026年5月</div>
      <button class="cal-nav" onclick="navMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div style="display:flex;gap:14px;justify-content:center;font-size:10px;color:var(--slate-500);margin-top:12px;font-weight:700;flex-wrap:wrap;">
      <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:var(--indigo-l);border:1px solid var(--indigo);"></span><span data-i18n="my.legend_work">出勤日</span></span>
      <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:var(--amber-l);border:1px solid var(--amber);"></span><span data-i18n="my.legend_request">休み変更申請中</span></span>
      <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:var(--slate-100);"></span><span data-i18n="my.legend_off">非出勤</span></span>
    </div>
  </div>
  <!-- 店長からのお知らせ -->
  <div class="list-card" id="announce-card" style="display:none;">
    <div class="list-title">📢 店長からのお知らせ</div>
    <div id="announce-list-area"></div>
  </div>

  <div class="list-card">
    <div class="list-title" data-i18n="my.upcoming">📋 これからの出勤予定</div>
    <div id="upcoming-list">
      <div class="list-empty" data-i18n="my.upcoming_empty_noname">名前を入力するとシフトが表示されます</div>
    </div>
  </div>
  <div class="list-card">
    <div class="list-title" data-i18n="my.change_history">📨 変更届の履歴</div>
    <div id="change-list">
      <div class="list-empty" data-i18n="my.change_empty">変更届の履歴はまだありません</div>
    </div>
  </div>
</div>
<div class="modal" id="change-modal" onclick="if(event.target===this)closeChangeModal()">
  <div class="modal-card">
    <div class="modal-handle"></div>
    <div class="modal-title" data-i18n="my.modal_title">🆘 休み変更届</div>
    <div class="modal-sub" data-i18n="my.modal_sub">出勤予定日を急遽休みたい場合に提出</div>
    <div class="modal-warn" data-i18n="my.modal_warn">⚠️ なるべく早めの申請をお願いします。代替スタッフの手配が必要なため、店長判断で承認/却下されます。</div>
    <div class="modal-field"><label data-i18n="my.field_date">休みたい日</label><input type="date" id="ch-date" /></div>
    <div class="modal-field"><label data-i18n="my.field_reason">理由</label>
      <select id="ch-reason">
        <option value="" data-i18n="my.reason_choose">選択してください</option>
        <option value="体調不良" data-i18n="my.reason_sick">体調不良</option>
        <option value="家庭の事情" data-i18n="my.reason_family">家庭の事情</option>
        <option value="学校の予定" data-i18n="my.reason_school">学校の予定</option>
        <option value="冠婚葬祭" data-i18n="my.reason_ceremony">冠婚葬祭</option>
        <option value="その他" data-i18n="my.reason_other">その他</option>
      </select>
    </div>
    <div class="modal-field"><label data-i18n="my.field_note">詳細・補足（任意）</label><textarea id="ch-note" placeholder="..."></textarea></div>
    <button class="modal-btn submit" onclick="submitChangeRequest()" data-i18n="my.modal_submit">📨 変更届を提出する</button>
    <button class="modal-btn cancel" onclick="closeChangeModal()" data-i18n="common.cancel">キャンセル</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const SHOP_ID = params.get('shop') || 'default';
  const DAY_NAMES = ['日','月','火','水','木','金','土'];
  let _shopMeta = null, _viewYear, _viewMonth, _shiftMaster = {}, _changeRequests = [];
  function nameKey() { return 'rakuraku_myshift_name_' + SHOP_ID; }
  function loadName() { try { return localStorage.getItem(nameKey()) || ''; } catch(e) { return ''; } }
  function saveName(n) { try { localStorage.setItem(nameKey(), n); } catch(e) {} }
  document.getElementById('staff-name').value = loadName();
  document.getElementById('staff-name').addEventListener('input', async e => { saveName(e.target.value); await loadChangeRequests(); render(); });
  document.getElementById('qa-clock-link').href = '/attendance.html?shop=' + encodeURIComponent(SHOP_ID);

  async function loadShopMeta() {
    try {
      const res = await fetch('/api/shop/' + encodeURIComponent(SHOP_ID) + '/meta');
      if (res.ok) { _shopMeta = await res.json(); document.getElementById('shop-name').textContent = _shopMeta.shopName || _shopMeta.name || SHOP_ID; }
    } catch(e) { document.getElementById('shop-name').textContent = SHOP_ID; }
  }
  async function loadShiftData() {
    try {
      const res = await fetch('/api/shop/' + encodeURIComponent(SHOP_ID) + '/snapshot');
      if (!res.ok) return;
      const data = await res.json();
      try { _shiftMaster = JSON.parse(data['shift_master'] || '{}'); } catch(e) { _shiftMaster = {}; }
    } catch(e) {}
  }
  async function loadChangeRequests() {
    const name = document.getElementById('staff-name').value.trim();
    if (!name) { _changeRequests = []; return; }
    try {
      const res = await fetch('/api/change-request?shop=' + encodeURIComponent(SHOP_ID) + '&name=' + encodeURIComponent(name));
      if (res.ok) _changeRequests = await res.json();
    } catch(e) {}
  }
  const today = new Date(); _viewYear = today.getFullYear(); _viewMonth = today.getMonth();
  function navMonth(delta) {
    _viewMonth += delta;
    if (_viewMonth < 0) { _viewMonth = 11; _viewYear--; } else if (_viewMonth > 11) { _viewMonth = 0; _viewYear++; }
    renderCalendar();
  }
  function getMyShiftFor(dateStr) {
    const dayData = _shiftMaster[dateStr];
    if (!dayData) return null;
    const name = document.getElementById('staff-name').value.trim();
    if (!name) return null;
    const found = [];
    function walk(node) {
      if (!node) return;
      if (Array.isArray(node)) { node.forEach(walk); return; }
      if (typeof node === 'object') {
        if (node.name === name || node.staff === name) { found.push(node); return; }
        Object.values(node).forEach(walk);
      }
    }
    walk(dayData);
    return found.length ? found : null;
  }
  function hasChangeRequestFor(dateStr) {
    const name = document.getElementById('staff-name').value.trim();
    return _changeRequests.some(r => r.date === dateStr && r.name === name && (r.status === 'pending' || r.status === 'approved'));
  }
  function renderCalendar() {
    document.getElementById('cal-month').textContent = _viewYear + '年' + (_viewMonth+1) + '月';
    const firstDay = new Date(_viewYear, _viewMonth, 1).getDay();
    const lastDate = new Date(_viewYear, _viewMonth+1, 0).getDate();
    const todayStr = today.toISOString().slice(0,10);
    let html = '';
    ['日','月','火','水','木','金','土'].forEach((d,i) => { const cls = i === 0 ? 'sun' : (i === 6 ? 'sat' : ''); html += `<div class="cal-dow ${cls}">${d}</div>`; });
    for (let i = 0; i < firstDay; i++) html += '<div class="cal-day empty"></div>';
    for (let date = 1; date <= lastDate; date++) {
      const dateStr = _viewYear + '-' + String(_viewMonth+1).padStart(2,'0') + '-' + String(date).padStart(2,'0');
      const dt = new Date(_viewYear, _viewMonth, date);
      const dow = dt.getDay();
      let cls = '';
      if (dateStr < todayStr) cls += ' past';
      if (dateStr === todayStr) cls += ' today';
      if (dow === 0) cls += ' sun';
      if (dow === 6) cls += ' sat';
      const shift = getMyShiftFor(dateStr);
      const hasReq = hasChangeRequestFor(dateStr);
      if (hasReq) cls += ' absence-requested'; else if (shift) cls += ' shift-confirmed'; else cls += ' shift-off';
      html += `<div class="cal-day ${cls}" onclick="prefilDateForRequest('${dateStr}')">${date}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
  }
  function prefilDateForRequest(dateStr) {
    const name = document.getElementById('staff-name').value.trim();
    if (!name) { showToast('まず名前を入力してください', 'error'); return; }
    const shift = getMyShiftFor(dateStr);
    if (!shift) { showToast('この日は出勤予定ではありません', 'error'); return; }
    document.getElementById('ch-date').value = dateStr;
    openChangeModal();
  }
  function renderTodayCard() {
    const todayStr = today.toISOString().slice(0,10);
    const shift = getMyShiftFor(todayStr);
    document.getElementById('today-date').textContent = (today.getMonth()+1) + '月' + today.getDate() + '日(' + DAY_NAMES[today.getDay()] + ')';
    if (shift && shift.length) {
      const first = shift[0];
      document.getElementById('today-time').textContent = first.time || (first.start && first.end ? first.start + '-' + first.end : '出勤');
    } else { document.getElementById('today-time').innerHTML = '<div class="today-empty">本日は出勤予定ではありません</div>'; }
  }
  function renderUpcoming() {
    const list = document.getElementById('upcoming-list');
    const name = document.getElementById('staff-name').value.trim();
    if (!name) { list.innerHTML = '<div class="list-empty">名前を入力するとシフトが表示されます</div>'; return; }
    const todayStr = today.toISOString().slice(0,10);
    const upcoming = [];
    Object.keys(_shiftMaster).sort().forEach(dateStr => {
      if (dateStr < todayStr) return;
      const shift = getMyShiftFor(dateStr);
      if (shift && shift.length) {
        const cancelled = hasChangeRequestFor(dateStr);
        const first = shift[0];
        upcoming.push({ dateStr, time: first.time || (first.start && first.end ? first.start + '-' + first.end : '出勤'), role: first.role || '', cancelled });
      }
    });
    if (!upcoming.length) { list.innerHTML = '<div class="list-empty">確定シフトはまだありません</div>'; return; }
    list.innerHTML = upcoming.slice(0, 14).map(u => {
      const [y,m,d] = u.dateStr.split('-').map(Number);
      const dow = DAY_NAMES[new Date(y, m-1, d).getDay()];
      return '<div class="list-row"><div class="day">' + m + '/' + d + '(' + dow + ')</div>' +
        '<div style="display:flex;align-items:center;gap:8px;">' + (u.role ? '<span class="pos">' + u.role + '</span>' : '') +
        '<span class="time">' + u.time + '</span>' + (u.cancelled ? '<span class="badge-cancel">休み申請中</span>' : '') + '</div></div>';
    }).join('');
  }
  function renderChangeList() {
    const list = document.getElementById('change-list');
    if (!_changeRequests.length) { list.innerHTML = '<div class="list-empty">変更届の履歴はまだありません</div>'; return; }
    list.innerHTML = _changeRequests.slice(0, 10).map(r => {
      const [y,m,d] = r.date.split('-').map(Number);
      const dow = DAY_NAMES[new Date(y, m-1, d).getDay()];
      const status = r.status === 'approved' ? '<span class="pos" style="background:var(--emerald-l);color:#047857;">✓ 承認済</span>'
                   : r.status === 'rejected' ? '<span class="pos" style="background:var(--red-l);color:#991B1B;">✕ 却下</span>'
                   : '<span class="pos" style="background:var(--amber-l);color:#92400E;">⏳ 申請中</span>';
      return '<div class="list-row"><div class="day">' + m + '/' + d + '(' + dow + ')<div style="font-size:10px;color:var(--slate-500);font-weight:600;">' + (r.reason || '') + '</div></div>' + status + '</div>';
    }).join('');
  }
  /* 店長からのお知らせを取得・表示 */
  async function renderAnnouncements() {
    const root = document.getElementById('announce-list-area');
    const card = document.getElementById('announce-card');
    let announcements = [];
    /* server優先、なければlocalStorage */
    try {
      const shopId = (typeof getShopId === 'function') ? getShopId() : 'default';
      const res = await fetch('/api/announcements/' + shopId);
      if (res.ok) announcements = await res.json();
    } catch(e) { /* fallback */ }
    if (!announcements.length) {
      try { announcements = JSON.parse(localStorage.getItem('rakuraku-announcements') || '[]'); } catch(e) {}
    }
    if (!announcements.length) { card.style.display = 'none'; return; }
    /* showフラグがtrueのもののみ */
    const visible = announcements.filter(a => a.show !== false);
    if (!visible.length) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    root.innerHTML = visible.slice(0, 5).map(a => {
      const priClr = a.priority === 'urgent' ? '#EF4444' : a.priority === 'important' ? '#F59E0B' : '#4F46E5';
      const priIc = a.priority === 'urgent' ? '🔴' : a.priority === 'important' ? '⚠' : '📌';
      const dt = a.publishedAt ? new Date(a.publishedAt).toLocaleDateString('ja-JP', { month:'numeric', day:'numeric' }) : '';
      return `<div style="padding:11px 12px;border-left:3px solid ${priClr};background:linear-gradient(90deg,${priClr}11,#fff);border-radius:6px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;">
          <div style="font-size:12px;font-weight:800;color:${priClr};">${priIc} ${escapeHtml(a.title)}</div>
          <div style="font-size:10px;color:var(--slate-500);font-weight:700;white-space:nowrap;">${dt}</div>
        </div>
        <div style="font-size:11px;color:var(--slate-700);line-height:1.7;white-space:pre-wrap;">${escapeHtml(a.body)}</div>
      </div>`;
    }).join('');
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

  function render() { renderCalendar(); renderTodayCard(); renderUpcoming(); renderChangeList(); renderAnnouncements(); }
  function openChangeModal() {
    const name = document.getElementById('staff-name').value.trim();
    if (!name) { showToast('まず名前を入力してください', 'error'); document.getElementById('staff-name').focus(); return; }
    if (!document.getElementById('ch-date').value) document.getElementById('ch-date').value = today.toISOString().slice(0,10);
    document.getElementById('change-modal').classList.add('show');
  }
  function closeChangeModal() { document.getElementById('change-modal').classList.remove('show'); }
  async function submitChangeRequest() {
    const name = document.getElementById('staff-name').value.trim();
    const date = document.getElementById('ch-date').value;
    const reason = document.getElementById('ch-reason').value;
    const note = document.getElementById('ch-note').value.trim();
    if (!name || !date || !reason) { showToast('名前・日付・理由は必須です', 'error'); return; }
    try {
      const res = await fetch('/api/change-request', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ shopId: SHOP_ID, name, date, reason, note, type: 'absence' }),
      });
      if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'サーバーエラー'); }
      closeChangeModal();
      showToast('✅ 変更届を提出しました', 'success');
      document.getElementById('ch-reason').value = '';
      document.getElementById('ch-note').value = '';
      await loadChangeRequests(); render();
    } catch(e) { showToast('⚠ ' + e.message, 'error'); }
  }
  if (typeof io === 'function') {
    const socket = io({ transports: ['websocket', 'polling'] });
    socket.on('connect', () => socket.emit('shop_join', { shopId: SHOP_ID }));
    socket.on('shop_data_updated', async (payload) => {
      if (payload.shopId !== SHOP_ID) return;
      if (payload.key === 'shift_master') { await loadShiftData(); render(); showToast('📡 シフトが更新されました'); }
    });
    socket.on('change_request_updated', async (payload) => {
      if (payload.shopId !== SHOP_ID) return;
      await loadChangeRequests(); render();
      if (payload.action === 'approved') showToast('✅ 変更届が承認されました', 'success');
      else if (payload.action === 'rejected') showToast('⚠ 変更届が却下されました', 'error');
    });
  }
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.className = 'toast ' + (type || ''); el.textContent = msg;
    el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2600);
  }
  (async function init() { await Promise.all([loadShopMeta(), loadShiftData(), loadChangeRequests()]); render(); })();
  window.addEventListener('rakuraku-lang-changed', function() { render(); });
</script>
<script src="/i18n.js"></script>
<script src="/offline-sync.js"></script>
<script>
  if (window.RakuI18n) RakuI18n.buildSwitcher('lang-switcher');
</script>
</body>
