<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>RAKURAKU 名刺デザイン — A4印刷10面</title>
<meta name="description" content="RAKURAKU 営業用名刺デザイン (A4 10面付け印刷用)"/>
<meta name="robots" content="noindex"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  @media print { .toolbar { display:none !important; } body { background:#fff; } .a4-grid { gap:0 !important; } }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#E5E7EB;color:#0F172A;}
  .toolbar{position:relative;z-index:10;background:#0F172A;color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;font-size:13px;}
  .toolbar button{padding:6px 16px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:800;}
  .toolbar input{padding:4px 8px;border:none;border-radius:4px;font-size:12px;width:280px;}
  .hint{color:#94A3B8;font-size:11px;}
  /* A4 portrait: 210mm x 297mm — 名刺サイズ 91×55mm を 2列×5行 = 10枚 */
  .a4-grid{width:210mm;margin:16px auto;padding:10mm;background:#fff;display:grid;grid-template-columns:91mm 91mm;grid-template-rows:repeat(5, 55mm);gap:2mm 8mm;box-shadow:0 8px 32px rgba(0,0,0,.15);}
  .card{width:91mm;height:55mm;border:1px dashed #CBD5E1;position:relative;overflow:hidden;background:#fff;}
  /* Front design */
  .card-front{background:linear-gradient(135deg,#0F172A 0%,#1E1B4B 60%,#4338CA 100%);color:#fff;padding:4mm 5mm;display:flex;flex-direction:column;justify-content:space-between;}
  .cf-top{display:flex;align-items:center;gap:2mm;}
  .cf-logo{width:7mm;height:7mm;background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:1.5mm;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;flex-shrink:0;}
  .cf-name{font-size:14px;font-weight:900;letter-spacing:-.01em;}
  .cf-tagline{font-size:7px;font-weight:600;color:rgba(255,255,255,.7);margin-top:.5mm;letter-spacing:.05em;}
  .cf-mid{margin-top:auto;}
  .cf-person{font-size:13px;font-weight:800;letter-spacing:-.01em;}
  .cf-role{font-size:7.5px;font-weight:600;color:rgba(255,255,255,.7);margin-top:.5mm;letter-spacing:.06em;}
  .cf-bottom{display:flex;justify-content:space-between;align-items:flex-end;font-size:7px;}
  .cf-bottom-left{line-height:1.5;}
  .cf-bottom-left .ic{margin-right:1mm;}
  .cf-qr{width:14mm;height:14mm;background:#fff;border-radius:1mm;padding:0.5mm;flex-shrink:0;}
  .cf-qr img{width:100%;height:100%;display:block;}
  /* Back design */
  .card-back{background:#fff;color:#0F172A;padding:4mm 5mm;display:flex;flex-direction:column;}
  .cb-eyebrow{font-size:6.5px;font-weight:900;color:#4F46E5;letter-spacing:.1em;margin-bottom:1mm;}
  .cb-headline{font-size:11px;font-weight:900;line-height:1.25;color:#0F172A;margin-bottom:1.5mm;}
  .cb-headline span{background:linear-gradient(135deg,#4F46E5,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .cb-features{font-size:7px;line-height:1.6;color:#475569;flex:1;}
  .cb-features li{list-style:none;margin-bottom:.3mm;}
  .cb-features li::before{content:'✓ ';color:#10B981;font-weight:900;}
  .cb-bottom{display:flex;justify-content:space-between;align-items:flex-end;}
  .cb-price{font-size:13px;font-weight:900;color:#4F46E5;letter-spacing:-.02em;}
  .cb-price small{font-size:7px;font-weight:700;color:#64748B;display:block;line-height:1;}
  .cb-trial{background:linear-gradient(135deg,#10B981,#059669);color:#fff;font-size:7px;font-weight:900;padding:1mm 2mm;border-radius:1.5mm;letter-spacing:.04em;}
  /* Page label (not printed) */
  .page-label{text-align:center;font-size:12px;font-weight:800;color:#475569;margin:20px 0 8px;}
  @media print { .page-label, .crop-info { display:none !important; } }
  .crop-info { text-align:center; font-size:11px; color:#475569; padding:10px; }
</style>
</head>
<body>

<div class="toolbar">
  <strong>💼 RAKURAKU 名刺 — A4 1枚で10名刺</strong>
  <label>QR URL: <input type="text" id="url-input" value="https://rakuraku-shift-production.up.railway.app" onchange="updateQR()"></label>
  <button onclick="window.print()">🖨️ 印刷</button>
  <span class="hint" style="margin-left:auto;">名刺サイズ 91×55mm / 余白「カスタム10mm」推奨 / カット線あり</span>
</div>

<div class="page-label">FRONT（表面）— 5名刺×2列 = 10枚</div>
<div class="a4-grid" id="front-grid">
  <!-- 10x card-front filled by JS -->
</div>

<div class="page-label">BACK（裏面）— 両面印刷時、表をひっくり返した状態</div>
<div class="a4-grid" id="back-grid">
  <!-- 10x card-back filled by JS -->
</div>

<div class="crop-info">
  💡 印刷後、点線でカット → 91×55mm の名刺10枚完成。<br>
  両面印刷したい場合: プリンタ設定で「短辺で綴じる」を選択。
</div>

<script>
  function buildFront() {
    return `
      <div class="card card-front">
        <div class="cf-top">
          <div class="cf-logo">R</div>
          <div>
            <div class="cf-name">RAKURAKU</div>
            <div class="cf-tagline">バー・飲食店専用 シフト管理 SaaS</div>
          </div>
        </div>
        <div class="cf-mid">
          <div class="cf-person">小泉 咲太</div>
          <div class="cf-role">CEO / Founder</div>
        </div>
        <div class="cf-bottom">
          <div class="cf-bottom-left">
            <div><span class="ic">📞</span>080-5168-3303</div>
            <div><span class="ic">📨</span>koizumishota0323@gmail.com</div>
            <div><span class="ic">🌐</span><span class="url-display">rakuraku-shift-production.up.railway.app</span></div>
          </div>
          <div class="cf-qr"><img class="qr-img" src="" alt="RAKURAKU 公式サイトQRコード" loading="lazy" decoding="async" /></div>
        </div>
      </div>
    `;
  }
  function buildBack() {
    return `
      <div class="card card-back">
        <div class="cb-eyebrow">FOR BAR & RESTAURANT</div>
        <div class="cb-headline">シフト作成、<br><span>1タップで完璧に。</span></div>
        <ul class="cb-features">
          <li>スマホで希望提出 → ワンタップ生成</li>
          <li>深夜割増 +25% 自動計算</li>
          <li>不足コマ → Timee/シェアフル ワンタップ配信</li>
          <li>売上 ・ 人件費率 一画面で可視化</li>
        </ul>
        <div class="cb-bottom">
          <div>
            <div class="cb-price">¥4,990<small>/月（税込）</small></div>
          </div>
          <div class="cb-trial">🎁 14日 無料</div>
        </div>
      </div>
    `;
  }
  function render() {
    const frontGrid = document.getElementById('front-grid');
    const backGrid  = document.getElementById('back-grid');
    frontGrid.innerHTML = '';
    backGrid.innerHTML  = '';
    for (let i = 0; i < 10; i++) {
      frontGrid.insertAdjacentHTML('beforeend', buildFront());
      backGrid.insertAdjacentHTML('beforeend', buildBack());
    }
    updateQR();
  }
  function updateQR() {
    const url = document.getElementById('url-input').value.trim() || 'https://rakuraku-shift-production.up.railway.app';
    document.querySelectorAll('.qr-img').forEach(img => {
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&margin=0&color=4F46E5`;
    });
    const display = url.replace(/^https?:\/\//, '');
    document.querySelectorAll('.url-display').forEach(el => { el.textContent = display; });
  }
  render();
</script>
</body>
</html>
