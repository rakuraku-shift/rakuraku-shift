<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<title>スタッフログイン — RAKURAKU</title>
<meta name="description" content="RAKURAKU スタッフ用ログインページ。1 回登録すれば次回から自動ログイン。" />
<meta name="theme-color" content="#DC2626">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #FCD34D;outline-offset:2px;border-radius:4px;}
  :root{
    --red:#DC2626; --red-d:#991B1B;
    --green:#10B981; --gold:#FCD34D;
    --slate-900:#0F172A; --slate-700:#334155; --slate-500:#64748B;
    --slate-200:#E2E8F0; --slate-100:#F1F5F9; --slate-50:#F8FAFC;
  }
  html,body{font-family:'Inter','Noto Sans JP',sans-serif;color:#fff;background:linear-gradient(180deg,#0F0F23,#1E1B4B);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:20px;padding-bottom:env(safe-area-inset-bottom, 20px);}
  .wrap{max-width:420px;width:100%;}

  .brand{text-align:center;margin-bottom:24px;}
  .brand-mark{display:inline-flex;align-items:center;gap:10px;font-weight:900;font-size:18px;color:#fff;}
  .brand-mark .ic{width:36px;height:36px;background:#DC2626;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;box-shadow:0 6px 18px rgba(220,38,38,.4);}

  h1{font-size:26px;font-weight:900;letter-spacing:-.01em;line-height:1.3;margin-bottom:8px;text-align:center;}
  .lead{font-size:13px;color:#94A3B8;text-align:center;margin-bottom:24px;}

  /* Shop chip */
  .shop-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;margin:0 auto 18px;}
  .shop-chip .dot{width:8px;height:8px;background:var(--green);border-radius:50%;}

  .card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1.5px solid rgba(255,255,255,.12);border-radius:22px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.45);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11px;font-weight:800;color:#94A3B8;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase;}
  .input{width:100%;padding:16px 18px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.15);border-radius:14px;color:#fff;font-size:16px;font-family:inherit;outline:none;font-weight:700;}
  .input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(252,211,77,.15);}
  .input::placeholder{color:rgba(255,255,255,.3);}

  /* PIN dots */
  .pin-wrap{display:flex;gap:10px;justify-content:center;margin:4px 0;}
  .pin-dot{flex:1;max-width:60px;height:64px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#fff;}
  .pin-dot.filled{border-color:var(--gold);background:rgba(252,211,77,.08);}
  .pin-input{position:absolute;left:-9999px;opacity:0;}

  /* Numpad */
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
  .key{height:62px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;color:#fff;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .05s, background .15s;}
  .key:hover{background:rgba(255,255,255,.12);}
  .key:active{transform:scale(.95);background:rgba(252,211,77,.2);}
  .key.del{font-size:18px;color:#FCA5A5;}
  .key.act{background:linear-gradient(135deg,var(--red),#F59E0B);box-shadow:0 6px 18px rgba(220,38,38,.35);font-size:18px;}

  .login-btn{margin-top:18px;width:100%;padding:16px;background:linear-gradient(135deg,var(--red),#F59E0B);color:#fff;border:none;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:.04em;box-shadow:0 10px 28px rgba(220,38,38,.4);}
  .login-btn:hover{transform:translateY(-2px);}
  .login-btn:disabled{opacity:.5;cursor:not-allowed;}

  .alert{display:none;margin-top:12px;padding:11px 14px;border-radius:10px;font-size:12px;font-weight:700;text-align:center;}
  .alert.show{display:block;}
  .alert.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#FCA5A5;}

  /* Language switcher */
  .lang-bar{position:absolute;top:20px;right:20px;display:flex;gap:4px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:4px;z-index:50;}
  .lang-btn{background:transparent;border:none;color:#94A3B8;font-size:11px;font-weight:800;padding:6px 9px;border-radius:7px;cursor:pointer;font-family:inherit;letter-spacing:.04em;}
  .lang-btn.active{background:rgba(252,211,77,.18);color:#FCD34D;}
  .lang-btn:hover{color:#fff;}
  @media(max-width:380px){.lang-bar{position:fixed;top:env(safe-area-inset-top,12px);right:12px;}}

  .info{margin-top:18px;font-size:11px;color:#94A3B8;line-height:1.8;text-align:center;}
  .info a{color:#FCD34D;text-decoration:none;font-weight:700;}

  /* Quick switch (auto-login state) */
  .quick-card{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(16,185,129,.05));border:1.5px solid rgba(16,185,129,.4);border-radius:18px;padding:24px;text-align:center;margin-bottom:14px;}
  .quick-card .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--green),#059669);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;margin:0 auto 12px;box-shadow:0 8px 20px rgba(16,185,129,.4);}
  .quick-card h2{font-size:18px;font-weight:900;margin-bottom:4px;}
  .quick-card .sub{font-size:12px;color:#86EFAC;font-weight:600;}
  .quick-btn{margin-top:14px;width:100%;padding:14px;background:linear-gradient(135deg,var(--green),#059669);color:#fff;border:none;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;}
  .quick-other{display:block;width:100%;margin-top:10px;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.15);color:#94A3B8;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;}

  @media(max-width:380px){
    h1{font-size:22px;}
    .card{padding:22px 18px;}
    .key{height:56px;font-size:20px;}
  }
</style>
</head>
<body>

<!-- Language switcher -->
<div class="lang-bar" role="group" aria-label="言語選択">
  <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日本語</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한국어</button>
  <button class="lang-btn" data-lang="vi" onclick="setLang('vi')">VI</button>
</div>

<div class="wrap">

  <div class="brand">
    <div class="brand-mark">
      <span class="ic">R</span>
      <span>RAKURAKU</span>
    </div>
  </div>

  <!-- ========== Quick re-login (前回ログイン済み) ========== -->
  <div id="quickView" style="display:none;">
    <div class="quick-card">
      <div class="avatar" id="qAvatar">山</div>
      <h2 id="qName">—</h2>
      <div class="sub" id="qShop">—</div>
    </div>

    <div class="info" style="margin-bottom:12px;" data-i18n="hint_enter_pin">PIN を入力して続行 →</div>

    <div class="card">
      <div class="pin-wrap">
        <div class="pin-dot" data-i="0"></div>
        <div class="pin-dot" data-i="1"></div>
        <div class="pin-dot" data-i="2"></div>
        <div class="pin-dot" data-i="3"></div>
      </div>

      <div class="numpad">
        <button type="button" class="key" onclick="addPin('1')">1</button>
        <button type="button" class="key" onclick="addPin('2')">2</button>
        <button type="button" class="key" onclick="addPin('3')">3</button>
        <button type="button" class="key" onclick="addPin('4')">4</button>
        <button type="button" class="key" onclick="addPin('5')">5</button>
        <button type="button" class="key" onclick="addPin('6')">6</button>
        <button type="button" class="key" onclick="addPin('7')">7</button>
        <button type="button" class="key" onclick="addPin('8')">8</button>
        <button type="button" class="key" onclick="addPin('9')">9</button>
        <button type="button" class="key del" onclick="delPin()">⌫</button>
        <button type="button" class="key" onclick="addPin('0')">0</button>
        <button type="button" class="key act" onclick="loginQuick()">✓</button>
      </div>

      <div class="alert err" id="quickErr"></div>

      <button class="quick-other" onclick="resetAccount()" data-i18n="other_account">別のアカウントでログイン</button>
    </div>
  </div>

  <!-- ========== New login (初回 or 別端末) ========== -->
  <div id="newView">
    <h1 data-i18n="title">スタッフログイン</h1>
    <p class="lead" data-i18n-html="lead">店長からの<strong style="color:#FCD34D;">招待リンク</strong>を開いた方は<br>下記をご入力ください</p>

    <div class="shop-chip" id="shopChip" style="display:none;">
      <span class="dot"></span>
      <span id="shopName">—</span>
    </div>

    <div class="card">
      <form onsubmit="event.preventDefault();loginNew();">
        <div class="field">
          <label data-i18n="name_label">お名前</label>
          <input type="text" class="input" id="newName" data-i18n-placeholder="name_placeholder" placeholder="例) 田中 太郎" autocomplete="name" autofocus />
        </div>

        <div class="field">
          <label data-i18n="pin_label">PIN コード (4 桁の数字)</label>
          <div class="pin-wrap">
            <div class="pin-dot" id="np0"></div>
            <div class="pin-dot" id="np1"></div>
            <div class="pin-dot" id="np2"></div>
            <div class="pin-dot" id="np3"></div>
          </div>
        </div>

        <div class="numpad">
          <button type="button" class="key" onclick="addNewPin('1')">1</button>
          <button type="button" class="key" onclick="addNewPin('2')">2</button>
          <button type="button" class="key" onclick="addNewPin('3')">3</button>
          <button type="button" class="key" onclick="addNewPin('4')">4</button>
          <button type="button" class="key" onclick="addNewPin('5')">5</button>
          <button type="button" class="key" onclick="addNewPin('6')">6</button>
          <button type="button" class="key" onclick="addNewPin('7')">7</button>
          <button type="button" class="key" onclick="addNewPin('8')">8</button>
          <button type="button" class="key" onclick="addNewPin('9')">9</button>
          <button type="button" class="key del" onclick="delNewPin()">⌫</button>
          <button type="button" class="key" onclick="addNewPin('0')">0</button>
          <button type="button" class="key act" onclick="loginNew()">✓</button>
        </div>

        <div class="alert err" id="newErr"></div>

        <p class="info" style="margin-top:14px;" data-i18n-html="device_save">
          📌 ログイン情報は<strong style="color:#fff;">この端末に保存</strong>されます<br>
          次回からは <strong style="color:#FCD34D;">PIN 入力だけ</strong>でログイン可能
        </p>
      </form>
    </div>

    <div class="info" style="margin-top:18px;" data-i18n-html="manager_link">
      店長の方は <a href="/founder-activate.html">こちら</a><br>
      🤔 招待リンクがない場合は店長にお問い合わせください
    </div>
  </div>

</div>

<script>
const SHOP_KEY  = 'rakuraku_shop';
const STAFF_KEY = 'rakuraku_staff';
const LANG_KEY  = 'rakuraku_lang';

let newPin = '';
let quickPin = '';

/* ============== i18n 翻訳辞書 ============== */
const I18N = {
  ja: {

    pin_label: 'PIN コード (4 桁の数字)',
    hint_enter_pin: 'PIN を入力して続行 →',
    device_save: '📌 ログイン情報は<strong style="color:#fff;">この端末に保存</strong>されます<br>次回からは <strong style="color:#FCD34D;">PIN 入力だけ</strong>でログイン可能',
    manager_link: '店長の方は <a href="/founder-activate.html">こちら</a><br>🤔 招待リンクがない場合は店長にお問い合わせください',
    other_account: '別のアカウントでログイン',
    err_name: 'お名前を入力してください',
    err_pin: '4 桁の PIN を入力してください',
    err_pin_wrong: 'PIN が違います',
    err_no_account: 'ログイン情報が見つかりません',
    confirm_reset: '別のアカウントでログインしますか?\n(現在の保存情報は削除されます)',
    san_suffix: ' さん'
  },
  en: {
    title: 'Staff Login',
    lead: 'If you received an <strong style="color:#FCD34D;">invitation link</strong> from your manager,<br>please fill in below',
    name_label: 'Your Name',
    name_placeholder: 'e.g.) John Smith',
    pin_label: 'PIN Code (4 digits)',
    hint_enter_pin: 'Enter PIN to continue →',
    device_save: '📌 Your login info is <strong style="color:#fff;">saved on this device</strong><br>Next time, just enter your <strong style="color:#FCD34D;">PIN</strong>',
    manager_link: 'Manager? <a href="/founder-activate.html">Click here</a><br>🤔 No invitation link? Please ask your manager',
    other_account: 'Login as different account',
    err_name: 'Please enter your name',
    err_pin: 'Please enter a 4-digit PIN',
    err_pin_wrong: 'Incorrect PIN',
    err_no_account: 'No account found',
    confirm_reset: 'Login as different account?\n(Current saved info will be deleted)',

  },
  zh: {
    title: '员工登录',
    lead: '收到店长发送的<strong style="color:#FCD34D;">邀请链接</strong>的员工<br>请在下方填写信息',
    name_label: '姓名',
    name_placeholder: '例) 张伟',
    pin_label: 'PIN 码 (4 位数字)',
    hint_enter_pin: '输入 PIN 继续 →',
    device_save: '📌 登录信息将<strong style="color:#fff;">保存在此设备上</strong><br>下次只需输入 <strong style="color:#FCD34D;">PIN 码</strong>即可登录',
    manager_link: '店长请 <a href="/founder-activate.html">点击这里</a><br>🤔 没有邀请链接? 请联系店长',
    other_account: '使用其他账户登录',
    err_name: '请输入您的姓名',
    err_pin: '请输入 4 位 PIN 码',
    err_pin_wrong: 'PIN 码错误',
    err_no_account: '未找到账户',
    confirm_reset: '使用其他账户登录?\n(当前保存信息将被删除)',
    san_suffix: ' 先生/女士'
  },
  ko: {
    title: '직원 로그인',
    lead: '점장님으로부터 <strong style="color:#FCD34D;">초대 링크</strong>를 받으셨다면<br>아래 정보를 입력해주세요',
    name_label: '이름',
    name_placeholder: '예) 김민수',
    pin_label: 'PIN 코드 (4자리 숫자)',
    hint_enter_pin: 'PIN 입력하여 계속 →',
    device_save: '📌 로그인 정보는 <strong style="color:#fff;">이 기기에 저장</strong>됩니다<br>다음부터는 <strong style="color:#FCD34D;">PIN 입력만</strong>으로 로그인 가능',
    manager_link: '점장님은 <a href="/founder-activate.html">여기로</a><br>🤔 초대 링크가 없으신가요? 점장님께 문의해주세요',
    other_account: '다른 계정으로 로그인',
    err_name: '이름을 입력해주세요',
    err_pin: '4자리 PIN을 입력해주세요',
    err_pin_wrong: 'PIN이 일치하지 않습니다',
    err_no_account: '계정을 찾을 수 없습니다',
    confirm_reset: '다른 계정으로 로그인하시겠습니까?\n(현재 저장된 정보는 삭제됩니다)',
    san_suffix: ' 님'
  },
  vi: {
    title: 'Đăng nhập Nhân viên',
    lead: 'Nếu bạn nhận được <strong style="color:#FCD34D;">liên kết mời</strong> từ quản lý,<br>vui lòng điền thông tin bên dưới',
    name_label: 'Tên của bạn',
    name_placeholder: 'VD) Nguyễn Văn A',
    pin_label: 'Mã PIN (4 chữ số)',
    hint_enter_pin: 'Nhập PIN để tiếp tục →',
    device_save: '📌 Thông tin đăng nhập sẽ được <strong style="color:#fff;">lưu trên thiết bị này</strong><br>Lần sau chỉ cần nhập <strong style="color:#FCD34D;">PIN</strong>',
    manager_link: 'Quản lý? <a href="/founder-activate.html">Nhấn vào đây</a><br>🤔 Không có liên kết mời? Vui lòng hỏi quản lý',
    other_account: 'Đăng nhập tài khoản khác',
    err_name: 'Vui lòng nhập tên',
    err_pin: 'Vui lòng nhập PIN 4 chữ số',
    err_pin_wrong: 'PIN không đúng',
    err_no_account: 'Không tìm thấy tài khoản',
    confirm_reset: 'Đăng nhập tài khoản khác?\n(Thông tin đã lưu sẽ bị xóa)',
    san_suffix: ''
  }
};

let currentLang = 'ja';

function detectLang(){
  /* 1. localStorage 優先 */
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) return saved;
  } catch(e){}
  /* 2. ブラウザ言語 */
  const browser = (navigator.language || 'ja').slice(0, 2).toLowerCase();
  if (I18N[browser]) return browser;
  return 'ja';
}

function setLang(lang){
  if (!I18N[lang]) lang = 'ja';
  currentLang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyI18n();
}

function applyI18n(){
  const t = I18N[currentLang];
  document.documentElement.lang = currentLang;

  /* 言語ボタンのアクティブ表示 */
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });

  /* テキストノード置換 */
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
  /* HTML置換 */
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (t[key]) el.innerHTML = t[key];
  });
  /* placeholder 置換 */
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (t[key]) el.placeholder = t[key];
  });

  /* クイックログイン画面の名前後ろ */
  const account = getSavedAccount();
  if (account){
    document.getElementById('qName').textContent = account.name + t.san_suffix;
  }
}

/* ============== URL パラメータから店舗 ID 取得 ============== */
function getURLParams(){
  const p = new URLSearchParams(location.search);
  return {
    shop: p.get('shop') || p.get('s'),
    shopName: p.get('name') || p.get('n'),
    inviteCode: p.get('invite') || p.get('i')
  };
}

/* ============== 状態の判定 ============== */
function getSavedAccount(){
  try { return JSON.parse(localStorage.getItem(STAFF_KEY) || 'null'); } catch(e){ return null; }
}
function getShopInfo(){
  try { return JSON.parse(localStorage.getItem(SHOP_KEY) || 'null'); } catch(e){ return null; }
}

function init(){
  const params = getURLParams();

  /* URL に店舗情報があれば保存 */
  if (params.shop || params.shopName){
    const info = getShopInfo() || {};
    if (params.shop) info.id = params.shop;
    if (params.shopName) info.name = decodeURIComponent(params.shopName);
    if (params.inviteCode) info.invite = params.inviteCode;
    localStorage.setItem(SHOP_KEY, JSON.stringify(info));
  }

  const account = getSavedAccount();
  const shop = getShopInfo();

  if (account && account.name && account.pin){
    /* Quick re-login view */
    document.getElementById('newView').style.display = 'none';
    document.getElementById('quickView').style.display = 'block';
    document.getElementById('qName').textContent = account.name + ' さん';
    document.getElementById('qShop').textContent = (shop && shop.name) ? shop.name : 'RAKURAKU';
    document.getElementById('qAvatar').textContent = account.name.charAt(0);
  } else {
    /* New login view */
    if (shop && shop.name){
      document.getElementById('shopChip').style.display = 'inline-flex';
      document.getElementById('shopName').textContent = shop.name;
    }
  }
}

/* ============== 新規ログイン (PIN 入力) ============== */
function addNewPin(d){
  if (newPin.length >= 4) return;
  newPin += d;
  updateNewPinDots();
  if (newPin.length === 4) setTimeout(loginNew, 200);
}
function delNewPin(){
  newPin = newPin.slice(0, -1);
  updateNewPinDots();
}
function updateNewPinDots(){
  for (let i = 0; i < 4; i++){
    const el = document.getElementById('np' + i);
    if (newPin.length > i){
      el.textContent = '●';
      el.classList.add('filled');
    } else {
      el.textContent = '';
      el.classList.remove('filled');
    }
  }
}

function loginNew(){
  const name = document.getElementById('newName').value.trim();
  const err = document.getElementById('newErr');
  const t = I18N[currentLang];
  err.classList.remove('show');

  if (!name){
    err.textContent = t.err_name;
    err.classList.add('show');
    return;
  }
  if (newPin.length !== 4){
    err.textContent = t.err_pin;
    err.classList.add('show');
    return;
  }

  const shop = getShopInfo() || {};
  const account = {
    name, pin: newPin,
    shopId: shop.id || 'default',
    shopName: shop.name || '',
    registeredAt: Date.now(),
    lastLoginAt: Date.now()
  };
  localStorage.setItem(STAFF_KEY, JSON.stringify(account));
  /* 本番では: fetch('/api/staff-login', POST) で登録 */
  goToShift();
}

/* ============== クイックログイン (再訪) ============== */
function addPin(d){
  if (quickPin.length >= 4) return;
  quickPin += d;
  updateQuickPinDots();
  if (quickPin.length === 4) setTimeout(loginQuick, 200);
}
function delPin(){
  quickPin = quickPin.slice(0, -1);
  updateQuickPinDots();
}
function updateQuickPinDots(){
  document.querySelectorAll('#quickView .pin-dot').forEach((el, i) => {
    if (quickPin.length > i){
      el.textContent = '●';
      el.classList.add('filled');
    } else {
      el.textContent = '';
      el.classList.remove('filled');
    }
  });
}
function loginQuick(){
  const err = document.getElementById('quickErr');
  const t = I18N[currentLang];
  err.classList.remove('show');
  const account = getSavedAccount();
  if (!account){
    err.textContent = t.err_no_account;
    err.classList.add('show');
    return;
  }
  if (quickPin !== account.pin){
    err.textContent = t.err_pin_wrong;
    err.classList.add('show');
    quickPin = '';
    updateQuickPinDots();
    return;
  }
  account.lastLoginAt = Date.now();
  localStorage.setItem(STAFF_KEY, JSON.stringify(account));
  goToShift();
}

/* ============== 別アカウント ============== */
function resetAccount(){
  const t = I18N[currentLang];
  if (!confirm(t.confirm_reset)) return;
  localStorage.removeItem(STAFF_KEY);
  location.reload();
}

/* ============== シフト画面へ遷移 ============== */
function goToShift(){
  /* 店舗ごとのトップ画面へ */
  const shop = getShopInfo();
  let url = '/myshift.html';
  if (shop && shop.id) url += '?shop=' + encodeURIComponent(shop.id);
  location.href = url;
}

currentLang = detectLang();
applyI18n();
init();
</script>
</body>
</html>
